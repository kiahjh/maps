t;:[&quot;hot-cave&quot;,&quot;baby-forest&quot;,&quot;plain&quot;],&quot;plain&quot;:[&quot;water-trail&quot;,&quot;bulika&quot;,&quot;hot-stream&quot;],&quot;water-trail&quot;:[&quot;plain&quot;],&quot;bulika&quot;:[&quot;square&quot;,&quot;palace&quot;,&quot;citizen-house&quot;,&quot;cellars&quot;,&quot;bulika-camp&quot;],&quot;palace&quot;:[&quot;bulika&quot;,&quot;palace-passages&quot;,&quot;black-hall&quot;,&quot;guest-room&quot;,&quot;alabaster&quot;,&quot;palace-tree&quot;],&quot;square&quot;:[&quot;bulika&quot;,&quot;palace&quot;],&quot;palace-passages&quot;:[&quot;palace&quot;],&quot;black-hall&quot;:[&quot;palace&quot;,&quot;guest-room&quot;],&quot;guest-room&quot;:[&quot;palace&quot;,&quot;alabaster&quot;],&quot;alabaster&quot;:[&quot;palace&quot;,&quot;guest-room&quot;],&quot;palace-tree&quot;:[&quot;palace&quot;,&quot;estate&quot;],&quot;citizen-house&quot;:[&quot;bulika&quot;],&quot;cellars&quot;:[&quot;bulika&quot;],&quot;mountain-city&quot;:[&quot;restored-upper&quot;,&quot;book-door&quot;],&quot;book-door&quot;:[&quot;mountain-city&quot;,&quot;library&quot;]},&quot;notes&quot;:{&quot;mara&quot;:&quot;The cottage belongs on these connecting journeys; its exact placement between the branches is provisional.&quot;,&quot;cataract&quot;:&quot;The fork and Evil Wood between its branches are explicit. The drawn angles, distances and outlines are provisional.&quot;,&quot;orchard&quot;:&quot;The restored basin’s refilling is anticipated by Vane. Its new shoreline is not surveyed later in the story.&quot;,&quot;evil-wood&quot;:&quot;The wood is explicitly between the branches. Its restored island status is anticipated; no complete shoreline is described.&quot;,&quot;hand-site&quot;:&quot;The burial point disappears after restoration; it is retained here as an event marker. The river’s source is farther upstream.&quot;,&quot;restored-upper&quot;:&quot;This is encountered after awakening. Its distance and relation to earlier forest outlines are not measured.&quot;,&quot;mountain-city&quot;:&quot;This city is explicitly different from Bulika. The gap and upstream distance are unmeasured.&quot;,&quot;estate&quot;:&quot;Inset: cross-world portals connect settings without placing the house at an ordinary country coordinate.&quot;,&quot;pine-portal&quot;:&quot;The first pine crossing is not securely identified with the later baby-finding forest.&quot;,&quot;palace&quot;:&quot;Interior locations below share this palace marker. Their complete floor plan is not supplied by the book.&quot;,&quot;carriage&quot;:&quot;The carriage is fewer than ten paces from the hall; its marker is separated slightly for visibility.&quot;,&quot;hot-stream&quot;:&quot;The hot stream flows even during the drought. Its connection to the great river’s waters is not established.&quot;,&quot;bulika&quot;:&quot;The city is schematic: the elevated palace and square connection are grounded; the wall shape and street arrangement are provisional.&quot;}},&quot;places&quot;:{&quot;alabaster&quot;:{&quot;id&quot;:&quot;alabaster&quot;,&quot;title&quot;:&quot;Round alabaster dining room&quot;,&quot;state&quot;:&quot;Dry palace / downstairs interior&quot;,&quot;refs&quot;:[&quot;25.035&quot;,&quot;25.045&quot;,&quot;25.055&quot;,&quot;26.007&quot;],&quot;paragraphs&quot;:[&quot;At the foot of the white stair a room to the left is round, all alabaster, without windows. Light filters through the material everywhere; a low dome carries flitting shadow effects. An ivory table and couch hold bread, cakes, fruit, milk, wine and silver goblets. The princess leads Vane back upstairs afterward. The room’s immediate connection is stated; its external facade or palace position is not.&quot;]},&quot;baby-forest&quot;:{&quot;id&quot;:&quot;baby-forest&quot;,&quot;title&quot;:&quot;Great baby-finding forest between valley and hot stream&quot;,&quot;state&quot;:&quot;Dry country / changing community&quot;,&quot;refs&quot;:[&quot;13.020&quot;,&quot;14.021&quot;,&quot;16.006&quot;,&quot;30.003&quot;,&quot;32.013&quot;,&quot;33.001&quot;],&quot;paragraphs&quot;:[&quot;Vane eventually explicitly identifies a forest extending all the way from the valley to the hot stream. Earlier resemblance of the guide forest to the baby forest is only his conjecture; the later statement establishes the broad connection. Parts are open, with large trees and little shrub undergrowth. Children search it at night for infants.&quot;,&quot;The source of all infants is unresolved: children guess tree-drop or eggs, and Vane later guesses mothers from Bulika. One fugitive mother does reach the colony, so that route is real, but it is not a universal explanation. Adam gives Lona a distinct history of divine fostering in the wilderness. No single nursery, egg grove, or portal-origin point can be mapped as fact.&quot;]},&quot;bad-burrow&quot;:{&quot;id&quot;:&quot;bad-burrow&quot;,&quot;title&quot;:&quot;Bad Burrow / evil hollow / monster basin&quot;,&quot;state&quot;:&quot;Dry basin → restored lake&quot;,&quot;refs&quot;:[&quot;10.005&quot;,&quot;10.012&quot;,&quot;11.001&quot;,&quot;31.045&quot;,&quot;40.044&quot;,&quot;40.050&quot;,&quot;42.016&quot;,&quot;45.004&quot;],&quot;paragraphs&quot;:[&quot;Beyond heather the ground becomes bare, spongy and powdery like dry peat. It ripples and heaves under monsters: a tiger-like burrower, white-maned red-necked bear-headed worm, feathered serpent and many unique mixed forms. Later encounters add bodiless heads, fleshy hairy tubes, beaks, claws, tentacles and long-necked corpse-headed shapes. This is ground behaving like a sea, not an actual early sea.&quot;,&quot;Moonlight restrains the creatures; mist, hill shadows, darkness and moonset intensify danger. A low hill range and ridge offer escape. The later party crosses a shallow basin with firm ground on the far side, but children do not see the monsters. After restoration it is a clear lake with greenish depths. A whirlpool has swept away burrowing soil; the monsters lie knotted, coiled or piled motionless at the bottom, expressly alive. No surveyed shoreline is provided.&quot;]},&quot;bags&quot;:{&quot;id&quot;:&quot;bags&quot;,&quot;title&quot;:&quot;Bags’ huts and changing occupation of the valley&quot;,&quot;state&quot;:&quot;Dry country / before and after relocation&quot;,&quot;refs&quot;:[&quot;12.024&quot;,&quot;13.001&quot;,&quot;13.110&quot;,&quot;33.001&quot;,&quot;33.026&quot;],&quot;paragraphs&quot;:[&quot;The initial giant settlement is in wood above the valley. Huts use fallen branches and a few stones; Vane lies on bare ground at a hut door and is tied to a fruitless work tree by day. Lona reports a largest unseen giant worshipped in one house. This reported house is not a visited landmark with a known plan.&quot;,&quot;The Bags destroy small fruit trees after Vane leaves. The Little Ones move beyond the giants’ range. Over a hundred giants later attack the nest forest and are repelled from fifty trees with collected stones and elephants. They depart to the other end of the orchard valley and never return to that forest. The old huts and the later giant location belong to different stages; no permanent administrative border is established.&quot;]},&quot;black-hall&quot;:{&quot;id&quot;:&quot;black-hall&quot;,&quot;title&quot;:&quot;Black-marble elliptical great hall&quot;,&quot;state&quot;:&quot;Dry palace / precise local geometry&quot;,&quot;refs&quot;:[&quot;25.019&quot;,&quot;25.020&quot;,&quot;26.007&quot;,&quot;36.003&quot;,&quot;36.016&quot;],&quot;paragraphs&quot;:[&quot;An enormous dark chamber has close-fitting black marble floor and walls; its plan/wall is elliptical, its roof the long half of an ellipsoid. A high oval opening lies over one focus, yielding a small patch of light rather than general illumination. Later the princess’s chair is at the north focus under the aperture, on a dais, with a mirror a little above and in front of her that reflects sunlight onto her. Meridional sunlight briefly illuminates her.&quot;,&quot;This north-focus statement is unusually precise local orientation. It still gives no citywide compass, room dimensions or explicit identification of this roof with the external central dome. A black curtain and white stair lead to the guest accommodation. Nocturnal dancers, shadow bodies and monsters mingle in the dark hall; images from the princess’s brain are not additional geographical rooms.&quot;,&quot;Lona dies on its marble. Frightened horses run into the unseen black wall; elephants reach the dais. These events confirm local floor, wall and dais relations, not the total hall scale.&quot;]},&quot;book-door&quot;:{&quot;id&quot;:&quot;book-door&quot;,&quot;title&quot;:&quot;Cloud fringe, golden-lock door, and closing book&quot;,&quot;state&quot;:&quot;Final transition to Earth&quot;,&quot;refs&quot;:[&quot;46.033&quot;,&quot;46.035&quot;,&quot;47.001&quot;],&quot;paragraphs&quot;:[&quot;After the rocky climb and cloud steps, Vane passes into white cloud folds. An unseen warm strong hand leads him to a little door with a golden lock, pushes him through, and he turns to see a large book cover closing. He is alone in the earthly library. This is the final return mechanism; neither a known route back through the mirror nor a conventional gate road. Lona is absent, Mara sometimes present, and Vane waits rather than attempting another mirror journey.&quot;]},&quot;bulika&quot;:{&quot;id&quot;:&quot;bulika&quot;,&quot;title&quot;:&quot;Bulika: country, gardens, walls, gates, and streets&quot;,&quot;state&quot;:&quot;Dry city / historical Land of Waters&quot;,&quot;refs&quot;:[&quot;15.036&quot;,&quot;22.004&quot;,&quot;22.008&quot;,&quot;22.011&quot;,&quot;23.001&quot;,&quot;35.007&quot;],&quot;paragraphs&quot;:[&quot;Mara names the city in grassy country and reports its rise from pastoral and agricultural life through diamond/opal mining and foreign commerce. Lilith’s sweeping imperial claims and citizens’ assertions of her power do not establish surveyed political borders. Other manufacturing towns are unnamed and unlocated.&quot;,&quot;At dawn old wall towers stand against pale sky. Vegetable gardens closely surround walls, with mostly unfamiliar crops and no flowers, water or animals seen. A belt of great gravel/refuse heaps lies between gardens and wall, thrown from battlements. Several roads approach different gates. One half-closed unguarded gate has apparently immovable hinges; the fortifications are neglected, not actively sealed.&quot;,&quot;Within are long narrow old streets, tall houses, stone paving, small archway hiding places and nearly impassable lanes connecting wider streets. No street names, full grid, gate count or city diameter is given. The populace leaves street centers to the advancing children and later watches from doors and windows. Vane’s early sunny sleeping spot is a few hundred yards outside the walls.&quot;]},&quot;bulika-camp&quot;:{&quot;id&quot;:&quot;bulika-camp&quot;,&quot;title&quot;:&quot;Temporary camp outside Bulika&quot;,&quot;state&quot;:&quot;After Lona’s death / captive Lilith&quot;,&quot;refs&quot;:[&quot;36.023&quot;,&quot;37.001&quot;,&quot;37.013&quot;,&quot;37.031&quot;,&quot;38.001&quot;],&quot;paragraphs&quot;:[&quot;The party exits by the entry gate to children gathered in thicker softer grass. Lona’s body lies among them; Lilith is watched separately outside the camp perimeter, with sentries and elephants. A white leopardess circles at moonrise and passes between captive and children. There are no built defenses or permanent dwellings.&quot;,&quot;Children report the Great Shadow descending from the palace hill and expanding through them before they flee out of the gate. Odu’s imagined home for him in moonless night is not a verified destination. The camp’s distance from the wall is not equated to Vane’s earlier few-hundred-yard sleeping spot.&quot;]},&quot;carriage&quot;:{&quot;id&quot;:&quot;carriage&quot;,&quot;title&quot;:&quot;Mouldering carriage and skeleton pair’s thicket&quot;,&quot;state&quot;:&quot;Dry country / close to ivy hall&quot;,&quot;refs&quot;:[&quot;17.001&quot;,&quot;17.060&quot;,&quot;38.011&quot;],&quot;paragraphs&quot;:[&quot;Less than ten paces after leaving the hall Vane encounters an old upright carriage on heavy wheels, fallen doors, two horse skeletons by the pole, a coachman’s skeleton and two skeletal passengers. Fibrous grass binds a damaged joint; a fallen branch serves as crutch. This establishes a small relic site, not a road network or known carriage destination.&quot;,&quot;On return the same pair occupy a nearby thicket and move more freely, gathering herbs; Vane’s proposed explanation that they rub their bones with them is conjecture. Raven says the hall dancers are spiritually far ahead of the pair although physically close. Their hell is a co-located state, not a separate region.&quot;]},&quot;cataract&quot;:{&quot;id&quot;:&quot;cataract&quot;,&quot;title&quot;:&quot;Old cataract scaur / great restored cataract&quot;,&quot;state&quot;:&quot;Dry rock → flowing fork&quot;,&quot;refs&quot;:[&quot;16.001&quot;,&quot;16.004&quot;,&quot;41.017&quot;,&quot;41.038&quot;,&quot;45.010&quot;],&quot;paragraphs&quot;:[&quot;After many unspecified desert miles, Vane reaches and climbs a rock marked by an ancient waterfall, with green moss and audible hidden water below. Above lies fine sand filling an upper river course. Ahead and left desert stretches beyond sight; a far-right forest skyline gives his next direction. Looking back reveals the river dividing as it fell, and Evil Wood between the two branches far away.&quot;,&quot;After restoration, the party follows the river upstream along its right bank without crossing to the sheer cataract at the foot of the former sandy desert. Above the climb is a broad deep quiet brim-full river in grassland. The text describes a shared cataract and two branches, not two separate waterfall sources.&quot;]},&quot;cellars&quot;:{&quot;id&quot;:&quot;cellars&quot;,&quot;title&quot;:&quot;Gem cellars and excavation labyrinth&quot;,&quot;state&quot;:&quot;Reported industry / observed child pit&quot;,&quot;refs&quot;:[&quot;23.012&quot;,&quot;23.030&quot;,&quot;35.016&quot;,&quot;35.019&quot;],&quot;paragraphs&quot;:[&quot;Citizens say they dig gems in their cellars, living on inherited wealth and trade while manufactured goods come from other towns. During the raid on one house Vane enters empty upstairs rooms and an under-stair door opening to a labyrinth of excavations, where a boy is in a hole. This physically confirms underground excavation, not the connection of every cellar beneath the entire city. A second nearby house contains a murdered child.&quot;]},&quot;cemetery&quot;:{&quot;id&quot;:&quot;cemetery&quot;,&quot;title&quot;:&quot;Rocky moor and unenclosed cemetery&quot;,&quot;state&quot;:&quot;Dry country / renewed departure&quot;,&quot;refs&quot;:[&quot;06.001&quot;,&quot;06.008&quot;,&quot;07.015&quot;,&quot;07.020&quot;,&quot;40.059&quot;,&quot;42.016&quot;,&quot;45.001&quot;],&quot;paragraphs&quot;:[&quot;Rocky moor, dry vegetation and moss lead to the cottage, first visible very far away. Gray clouds, sinking western sun, strong cold and a gray starless horizon produce the approach. The whole flat unenclosed heath is described as cemetery, although Vane sees neither marked graves nor a church. Many sleepers lie above ground like thick fallen petals; few are buried underneath.&quot;,&quot;Its apparent boundary is the horizon, not a measured wall. The sexton’s day cycles through four seasons. Later a distant light, Adam’s doorway candle, or Eve’s window candle guides the returning party. After awakening, the same heath has visible heather bells, shrubs and grass in a twilight without ordinary shadows.&quot;]},&quot;church&quot;:{&quot;id&quot;:&quot;church&quot;,&quot;title&quot;:&quot;Ruined church and prayer-flower&quot;,&quot;state&quot;:&quot;Earth / overlapping sacred setting&quot;,&quot;refs&quot;:[&quot;05.001&quot;,&quot;05.007&quot;,&quot;05.009&quot;,&quot;05.025&quot;,&quot;05.033&quot;],&quot;paragraphs&quot;:[&quot;The ancient white-flowering hawthorn in the home-farm church ruins looks to Vane like a white-headed man. Raven says old worshippers continue to gather and sing; windlike music and an ascending white pigeon belong to the encounter. The pigeon interpreted as prayer and celestial stair language need no separate literal staircase.&quot;,&quot;At the foot of a granite block stands one unfamiliar anemone-like flower, pale rose with golden center and remarkable scent. Raven identifies it with prayer. It is a localized exceptional flower, distinct from the proposed rose garden that Vane has not planted.&quot;]},&quot;citizen-house&quot;:{&quot;id&quot;:&quot;citizen-house&quot;,&quot;title&quot;:&quot;Citizen’s stair, landing, stone room, and adjoining chamber&quot;,&quot;state&quot;:&quot;Dry city / repeated visits&quot;,&quot;refs&quot;:[&quot;23.031&quot;,&quot;24.001&quot;,&quot;24.009&quot;,&quot;26.014&quot;],&quot;paragraphs&quot;:[&quot;After a maze of lanes, a steep narrow stair lies between two tall houses. Its top landing, about a man’s length, separates opposite doors and shelters Vane from the street wind. One door closes against him. Mara later admits him to an empty stone-paved room where a rug serves as bed, lit by moonlight.&quot;,&quot;A narrow interior passage leads to the adjacent newborn’s room. The spotless leopardess has too little room to turn on the stair and somersaults out. Vane retraces the stair to the street; later Shadow follows the same route. The repeated woman-death scenes should be retained in their sequence rather than normalized into a rationalized floor plan or an invented second street.&quot;]},&quot;discovery-tree&quot;:{&quot;id&quot;:&quot;discovery-tree&quot;,&quot;title&quot;:&quot;Lilith’s discovery tree and converging animal tracks&quot;,&quot;state&quot;:&quot;Dry forest / temporary care site&quot;,&quot;refs&quot;:[&quot;18.001&quot;,&quot;18.008&quot;,&quot;18.010&quot;,&quot;18.018&quot;],&quot;paragraphs&quot;:[&quot;Facing a low copper-dark dented moon, Vane finds a wasted cold woman under a spreading tree on hard root-woven ground and pine needles. He brings grapes from the hall, makes a branch-and-leaf bed and tends her. Her initial arrival and life/death condition are not explained by a confirmed local history.&quot;,&quot;Before dawn, animal paths converge into a well-beaten track, widening as lesser tracks join. Miniature horses, dwarf cattle, elephants and other animals lead to the forest edge. The route establishes an approach to the hot river; no surveyed distance from the hall or source cave is given.&quot;]},&quot;entry-heath&quot;:{&quot;id&quot;:&quot;entry-heath&quot;,&quot;title&quot;:&quot;Mirror-entry heath and first horizon&quot;,&quot;state&quot;:&quot;Dry country / entry&quot;,&quot;refs&quot;:[&quot;02.009&quot;,&quot;03.001&quot;,&quot;03.040&quot;,&quot;09.007&quot;,&quot;09.029&quot;],&quot;paragraphs&quot;:[&quot;From the mirror: flat melancholy moor near at hand, low desolate broken heathy hills in the middle distance, and mountain tops on the far horizon. Once through, there is no familiar house or visible door behind, only ambiguous foglike distance. Low plants and wind are perceptible. Raven has a shadow although no shining sun is seen in the opening episode.&quot;,&quot;A later search traverses thickets and several small fir woods without finding the expected pine forest. Near-horizon sun brings winter cold. Raven points toward a blinding setting sun before the yellow light-creature leads Vane, supporting a westward initial direction in that particular scene. The placement of the mirror horizon mountains relative to later regions is not resolved.&quot;]},&quot;estate&quot;:{&quot;id&quot;:&quot;estate&quot;,&quot;title&quot;:&quot;Earthly estate, lawn, garden, and home-farm&quot;,&quot;state&quot;:&quot;Earth&quot;,&quot;refs&quot;:[&quot;01.001&quot;,&quot;01.003&quot;,&quot;04.004&quot;,&quot;05.007&quot;,&quot;28.001&quot;,&quot;29.010&quot;],&quot;paragraphs&quot;:[&quot;An old inherited estate without stated address. The ancient house has been enlarged into a rambling collection of wings and rooms. The lawn has a central fountain built by Vane’s father; its jet rises a hundred feet before foaming outward. A garden porch covered in creepers leads to a grassy nook between two parts of the house. Ground-floor windows admit Raven. Shrubs, goldfish, a thrush and the Persian cat establish ordinary garden life.&quot;,&quot;The home-farm contains old church ruins and an ancient hawthorn. Vane intends a rose wilderness around those ruins and a three-yard plough exclusion around the tree, but this is an unfulfilled plan. An unnamed village supplies the butler’s ghost-story source. The blue sea in the father’s writing and Vane’s Oxford history do not locate the estate.&quot;]},&quot;evil-wood&quot;:{&quot;id&quot;:&quot;evil-wood&quot;,&quot;title&quot;:&quot;Evil Wood&quot;,&quot;state&quot;:&quot;Nocturnal phantoms / anticipated restored isle&quot;,&quot;refs&quot;:[&quot;09.024&quot;,&quot;11.005&quot;,&quot;11.009&quot;,&quot;11.014&quot;,&quot;16.004&quot;,&quot;32.004&quot;,&quot;42.001&quot;],&quot;paragraphs&quot;:[&quot;A mixed forest unlike the entry pine wood, with glades, enclosing low boughs and unfamiliar eucalyptus-like growth. Foliage suggests wolves, horses, skeletons and a woman as cold and wind arrive. At night Vane sees a violent phantom/skeleton battle and misty or white-boned horses. Just before sunrise the figures collapse; daylight reveals no bones, only withered branches and burial-like sounds. No ordinary birds or small animals are seen on that day.&quot;,&quot;The scaur view explicitly places the wood between the two river branches. Raven says Vane’s grandfather is among those who fight there instead of sleeping. Cats later drive Vane through the wood unseen on his way back to the fruit valley. Restoration would make it an isle in Vane’s anticipation; the later party does not survey its full new water boundary.&quot;]},&quot;first-branch&quot;:{&quot;id&quot;:&quot;first-branch&quot;,&quot;title&quot;:&quot;First dry river branch / broader, rougher branch&quot;,&quot;state&quot;:&quot;Dry channels → flowing water&quot;,&quot;refs&quot;:[&quot;11.001&quot;,&quot;11.004&quot;,&quot;16.004&quot;,&quot;31.045&quot;,&quot;38.015&quot;,&quot;41.022&quot;,&quot;45.008&quot;],&quot;paragraphs&quot;:[&quot;The first immense crossing before Evil Wood consists of exposed rock, many water-runs, flat or channelled surfaces, humped and pinnacled places, dry moss and hard lichens. A day passes before Vane reaches the wood. Sounds suggest water but he crosses no actual water then. Night riding later involves ravines and chasms, and the horse falls by a wide shallow channel near the midst of the crossings.&quot;,&quot;The cataract view recognizes this as one of the two branches. Later Vane wants help crossing the broader, rougher branch on the route toward the cemetery; Mara supplies an easy crossing. On the hand mission he crosses channels of the first branch and judges Mara near. Those passages connect the route but do not specify all individual channels or a compass bearing.&quot;]},&quot;garret&quot;:{&quot;id&quot;:&quot;garret&quot;,&quot;title&quot;:&quot;Garret, wooden chamber, and mirror apparatus&quot;,&quot;state&quot;:&quot;Earth / portal&quot;,&quot;refs&quot;:[&quot;02.003&quot;,&quot;02.008&quot;,&quot;08.044&quot;,&quot;08.055&quot;,&quot;09.001&quot;,&quot;30.029&quot;],&quot;paragraphs&quot;:[&quot;The detailed ascent runs from library to hall, great stair, first-floor main rooms, wide corridor, narrower stair, second-floor passages, a door and winding wooden stair. The huge garret has beams, rafters, long dim views, other doors, few cobwebbed windows and dusky skylights. The father’s account adds gaps without flooring where he steps joist to joist, with light entering along roof-slab edges.&quot;,&quot;A rough unpainted plank enclosure stands within the garret; its chamber narrows upward through the roof. The dusty oblong floor mirror leans against the wall, framed in ebony, with eagle ornament, chains and black ball. Another mirror stands opposite. Chains adjust a rotating hood/top, altering sunlight and reflected rays. The vista clears to heath and distant mountains before passage. Noon adjustment works in narrated entries, but Vane’s optical explanation is conjectural.&quot;]},&quot;guest-room&quot;:{&quot;id&quot;:&quot;guest-room&quot;,&quot;title&quot;:&quot;White stair, guest chamber, and sunken bath&quot;,&quot;state&quot;:&quot;Dry palace / private water&quot;,&quot;refs&quot;:[&quot;25.020&quot;,&quot;25.032&quot;,&quot;25.035&quot;,&quot;26.003&quot;,&quot;26.007&quot;],&quot;paragraphs&quot;:[&quot;Behind a black curtain a white stair ascends to a beautiful guest chamber. A robe lies at the couch foot; a lamp hangs from the ceiling. A great white clear-water bath is sunk in the marble floor at one corner, with an unfamiliar delicate fragrance. The source and supposed enchantment are conjectural. This private water is an exception to the dry country, not proof of a public city water system.&quot;]},&quot;guide-forest&quot;:{&quot;id&quot;:&quot;guide-forest&quot;,&quot;title&quot;:&quot;Guide forest and rose wood&quot;,&quot;state&quot;:&quot;Dry country / route to the hot stream&quot;,&quot;refs&quot;:[&quot;15.068&quot;,&quot;16.005&quot;,&quot;16.010&quot;,&quot;16.025&quot;,&quot;18.001&quot;],&quot;paragraphs&quot;:[&quot;Mara instructs Vane to go up the river bank until it disappears, verge right to forest, then leave it facing a rising moon and keep that heading. Tamarisk and juniper give way to stunted firs, larger firs, and pines mixed with other trees. Large trunks stand almost geometrically, with little undergrowth, long views, colored and white butterflies and some birds.&quot;,&quot;The pines open into flowering shrubs and splendid tree-sized roses among immense columnar trees. The hall and carriage occur within this route. Later recognition on the return from Bulika places them between the hot-stream crossing and the nest village, but no measured forest path or perimeter is supplied.&quot;]},&quot;hand-site&quot;:{&quot;id&quot;:&quot;hand-site&quot;,&quot;title&quot;:&quot;Upper sand and the burial of Lilith’s hand&quot;,&quot;state&quot;:&quot;Dry action site → erased in restoration&quot;,&quot;refs&quot;:[&quot;16.003&quot;,&quot;41.017&quot;,&quot;41.038&quot;,&quot;42.001&quot;,&quot;45.011&quot;],&quot;paragraphs&quot;:[&quot;Above the cataract stretches a sandy upper plain and old river course. Adam sends Vane deep into it, following underground sound by repeated listening every few yards. At the loudest point he digs a large pit through loose sand to damp soil. Water oozes from under the hand’s fingers before he covers it level with the desert and sleeps.&quot;,&quot;The waking ground is moist and his old track has quicksand as the river stirs. On the final upstream passage there is no sign of the burial, and the river comes from far beyond. This place begins the narrated release without becoming the ultimate river headwater. Its exact distance or direction from the scaur is not measured.&quot;]},&quot;hot-cave&quot;:{&quot;id&quot;:&quot;hot-cave&quot;,&quot;title&quot;:&quot;Rocky hot-stream source cave and bridge-bed&quot;,&quot;state&quot;:&quot;Temporary dwelling / inspected spring&quot;,&quot;refs&quot;:[&quot;18.025&quot;,&quot;18.033&quot;,&quot;19.001&quot;,&quot;19.027&quot;],&quot;paragraphs&quot;:[&quot;Upstream nearby rocky hills contain a small cave at the foot of one hill. Water rises quietly from the ground at the back, like the base of a column, and runs along one side through a deep narrow channel. The outlet does not fill the whole cave entrance. Vane’s imagined internal waterfall stair is explicitly disproved.&quot;,&quot;He arranges boulders and spans the stream with fallen beech boughs, dry yellow leaves, cross-twigs and packed leaves/moss, making a bed warmed from below. Warm water keeps air fresh but sometimes oppressive; outside air is cooler. Forest fruit and fiber supply food and clothing. Care extends beyond three months. This is a makeshift bridge-bed, not a village or permanent stone bridge.&quot;]},&quot;hot-stream&quot;:{&quot;id&quot;:&quot;hot-stream&quot;,&quot;title&quot;:&quot;Hot river at the forest edge&quot;,&quot;state&quot;:&quot;Visible water / protective crossing&quot;,&quot;refs&quot;:[&quot;18.017&quot;,&quot;18.020&quot;,&quot;25.046&quot;,&quot;30.004&quot;,&quot;32.013&quot;,&quot;38.001&quot;],&quot;paragraphs&quot;:[&quot;A deep brim-full stream, only a few yards wide, runs along the forest edge beside a vast green grassy plain. Bluish mist rises from hot, metallic-tasting water. Its current is swift and steady. Animals swim across toward grazing; Vane supposes they sleep in the wood and feed on the plain.&quot;,&quot;This is Mara’s instructed running-stream crossing before Bulika. Adam later confirms that it stopped Lilith’s attack and that she could bypass it only through the three-dimensional world in contact with Vane. The barrier is a magical crossing restriction, not a built wall. The return party crosses it before the ivy hall and nest village; Lilith’s eyes close after crossing.&quot;]},&quot;ivy-hall&quot;:{&quot;id&quot;:&quot;ivy-hall&quot;,&quot;title&quot;:&quot;Rose-and-ivy vegetal hall&quot;,&quot;state&quot;:&quot;Vegetal enclosure / nocturnal ballroom&quot;,&quot;refs&quot;:[&quot;16.011&quot;,&quot;16.024&quot;,&quot;18.003&quot;,&quot;38.008&quot;,&quot;38.009&quot;],&quot;paragraphs&quot;:[&quot;A house or castle-like shape appears among plants, but Vane cannot verify masonry; an ivy-swallowed ruin is his conjecture. A rectangular doorless gap opens into hall-like space with grass and flowers for floor and ivy, vine and roses for walls and roof. He beds on dead leaves in a corner. Sky and stars show through the branch roof; nesting birds, owl and mice inhabit it. Grapes grow by its doorway.&quot;,&quot;At midnight the place seems a splendid hall with ancient dancers whose faces are skulls and whose bodies pass through Vane. Wind strips finery and bodies away. The returning children later play among the dancers. A Lilith-like doorway apparition does not establish a second palace or a second bodily captive. For illustration the plant fabric is secure; stone towers would be invention.&quot;]},&quot;library&quot;:{&quot;id&quot;:&quot;library&quot;,&quot;title&quot;:&quot;Library and masked book closet&quot;,&quot;state&quot;:&quot;Earth / cross-world access&quot;,&quot;refs&quot;:[&quot;01.003&quot;,&quot;01.009&quot;,&quot;07.040&quot;,&quot;07.046&quot;,&quot;07.048&quot;,&quot;07.050&quot;,&quot;29.060&quot;,&quot;30.011&quot;],&quot;paragraphs&quot;:[&quot;The library occupies most of the ground floor. A large principal room has shelves nearly to the ceiling; adjoining irregular rooms connect through doors, arches, short passages and changes of level. An ancestral portrait occupies a niche among books; other portraits hang in a gallery and great rooms. One window looks over the lawn fountain.&quot;,&quot;A low, narrow, thick door is disguised by projecting frame and false book backs. Behind it is a rare-book closet with no ordinary second exit; a fixed fragment of manuscript seems impossible to remove. A dark corner contains drawers. A small eastern window and mirror throw morning sun toward the masked door; Vane reads in a western window. A couch is used for overnight sleep.&quot;,&quot;Escape from the House of Sleep places Vane at this door holding its handle. Lilith is later locked in the closet behind a marked threshold. Raven denies that this makes the closet geographically adjacent to the sexton’s cottage: the book links settings without establishing ordinary distance.&quot;]},&quot;lost-tower&quot;:{&quot;id&quot;:&quot;lost-tower&quot;,&quot;title&quot;:&quot;Sir Upward’s lost tower&quot;,&quot;state&quot;:&quot;Historical account&quot;,&quot;refs&quot;:[&quot;08.019&quot;,&quot;08.029&quot;],&quot;paragraphs&quot;:[&quot;Within the father’s manuscript, Raven describes Sir Upward’s library of a hundred manuscripts. From the great hall a steep rough descent and underground passage lead to a newly built tower, its stair, and top room. A tiny key opens a very large lock. The threshold reveals immense space, blue mountains and a paler blue sky. The tower subsequently disappears; it is not an extant building on Vane’s present estate.&quot;]},&quot;low-hills&quot;:{&quot;id&quot;:&quot;low-hills&quot;,&quot;title&quot;:&quot;Low hills, escape ridge, and first river approach&quot;,&quot;state&quot;:&quot;Dry / restored route&quot;,&quot;refs&quot;:[&quot;10.015&quot;,&quot;10.017&quot;,&quot;11.001&quot;,&quot;40.044&quot;,&quot;43.009&quot;,&quot;45.008&quot;],&quot;paragraphs&quot;:[&quot;The low range beyond the monster country offers a moonlit ridge and a warmer short descent where Vane waits for dawn. From the summit at sunrise he sees the apparently lifeless hollow behind and an empty expanse with a differently colored possible forest ahead. Descent reaches the first exposed river-bed. Later Mara’s party reaches a ridge above the basin at sunset after crossing the river channels.&quot;,&quot;The book establishes a separating ridge and journey order, not a named mountain chain or elevation. It does not identify these hills with the first mirror horizon mountains, the hot-stream source hills, or the final solitary mountain.&quot;]},&quot;mara&quot;:{&quot;id&quot;:&quot;mara&quot;,&quot;title&quot;:&quot;Mara’s House of Bitterness&quot;,&quot;state&quot;:&quot;Dry / repentance / first local rain&quot;,&quot;refs&quot;:[&quot;15.050&quot;,&quot;15.062&quot;,&quot;15.085&quot;,&quot;38.091&quot;,&quot;39.006&quot;,&quot;39.108&quot;,&quot;41.037&quot;],&quot;paragraphs&quot;:[&quot;A cottage resembling the sexton’s but with thicker walls, its rock foundation deep in a wide tract of sand. A heavy strong outer door leads directly into a large bare room. Two small opposite glassless windows and two doors produce the original moon sightline. A horn lantern stands at the hearth. Mara lives alone except for guests.&quot;,&quot;A narrow steep stair leads to an unpartitioned, unceiled garret with one broad low dormer. The guest bed stands under the slope with a white coverlet; dry bread and cold water are supplied. On leaving, Vane finds the house abruptly doorless and cannot get back in. Later visits restore the open doorway.&quot;,&quot;The main room later has clay floor, small hearth fire, a lamp high on the chimney-piece and a rough settle initially at one side. It is moved to the center with Lilith’s feet toward the hearth; Mara and Vane sit on opposite sides of the fire. Mara’s own bed lies in a downstairs corner, separate from the guest bed above. Bread and pitcher remain on the table during the two later empty-house passages.&quot;,&quot;Cats, inner fire, invisible water and Lilith’s inward hell belong to its changing experiential state. The children cannot say whether their garret flood and cats were dream or waking. Actual soft rain wets the outer desert at dawn after Lilith’s surrender; this is separately narrated.&quot;]},&quot;mara-approach&quot;:{&quot;id&quot;:&quot;mara-approach&quot;,&quot;title&quot;:&quot;Mara’s sandy approach, ravines, and hollows&quot;,&quot;state&quot;:&quot;Dry country / transition&quot;,&quot;refs&quot;:[&quot;14.025&quot;,&quot;15.001&quot;,&quot;15.035&quot;,&quot;38.015&quot;,&quot;40.043&quot;],&quot;paragraphs&quot;:[&quot;Leaving the children’s branch escort brings Vane into sandy country. Numerous small ravines obstruct his night walk; he sleeps in a sandy hollow. Mara’s cottage appears in alignment with a setting moon, light shining through an open door or window. This is a sightline, not a building on or near the lunar surface.&quot;,&quot;Later the small returning party camps in desert between the branches and sees the house before evening on the next day. The route confirms a sandy inter-branch approach, but does not triangulate the cottage. Local rain later arrives while surrounding travel country is still dry.&quot;]},&quot;mountain-city&quot;:{&quot;id&quot;:&quot;mountain-city&quot;,&quot;title&quot;:&quot;Unnamed mountain city, water-street, gate, and ascent&quot;,&quot;state&quot;:&quot;Final upstream country / called heaven&quot;,&quot;refs&quot;:[&quot;46.001&quot;,&quot;46.005&quot;,&quot;46.021&quot;,&quot;46.025&quot;,&quot;46.032&quot;,&quot;46.033&quot;],&quot;paragraphs&quot;:[&quot;Far across a plain, a strange city occupies the side of a solitary mountain, summit lost in cloud; it is explicitly unlike Bulika. Rock, palace and cloud first blend visually. A tower or rock rises above the city nearer the crest, but its nature is uncertain. Lightning reveals living cloud forms without thunder. Rain intensifies and a rainbow spans the city.&quot;,&quot;The river comes visibly from the very peak through the main street. Clear pale beryl-like water descends deep broad steps of porphyry and serpentine through the gate toward the mountain foot. Shallower walking steps on both banks lead upward; the bed supports flowering grass instead of sand or shingle. The gate is open. A dark-visaged woman-angel portress stands outside on its landing; descending woman-angels receive the children.&quot;,&quot;The gate consists of living archetypes of precious stones. A great angel calls it heaven/kingdom, mentions black bats on unlocated frontiers, and orders animals to royal stables and then the King’s forest. Neither destination is visited or spatially described. The city is not named New Jerusalem in this scene, though Eve previously bears that biblical title.&quot;,&quot;At the upper edge there is no wall. Huge broken rocks like a glacier moraine let the river billow through gaps. Three or four giant steps vanish into a snow-white cloud. The throne/source is seen with the mind’s eye. Angel guidance ends before Vane climbs with hands and feet and must release Lona’s hand.&quot;]},&quot;nests&quot;:{&quot;id&quot;:&quot;nests&quot;,&quot;title&quot;:&quot;Little Ones’ high nest village&quot;,&quot;state&quot;:&quot;Dry country / later colony&quot;,&quot;refs&quot;:[&quot;32.024&quot;,&quot;32.033&quot;,&quot;33.001&quot;,&quot;33.019&quot;,&quot;34.007&quot;,&quot;38.014&quot;],&quot;paragraphs&quot;:[&quot;After giant damage, the children build sleeping nests high in tall welcoming trees, beyond the Bags’ range but close enough for nocturnal fruit visits to the old orchards. They learn nests from birds and climb bough to bough; they have arms and legs, not wings. One occupied tree is an enormous walnut. There is little underbrush and no conventional street of houses.&quot;,&quot;Stone is scarce, gathered from far away for nest defense. Lona’s tree is the site of the spotted and white cats’ battle. Bright birds, friendly miniature animals, stored fruit, later full-sized horses on the outskirts and leaf garments give this site its specific appearance. The party returns here after the ivy hall, stays a night and resettles most children before the smaller group goes to Mara. No precise forest area or nest count follows from the fifty defended trees.&quot;]},&quot;orchard&quot;:{&quot;id&quot;:&quot;orchard&quot;,&quot;title&quot;:&quot;Former lake basin / fruit valley / Little Ones’ hollow&quot;,&quot;state&quot;:&quot;Dry habitation / restoration anticipated&quot;,&quot;refs&quot;:[&quot;12.001&quot;,&quot;12.003&quot;,&quot;13.001&quot;,&quot;13.069&quot;,&quot;14.001&quot;,&quot;15.039&quot;,&quot;33.001&quot;,&quot;42.001&quot;],&quot;paragraphs&quot;:[&quot;A hollow interpreted as an old lake basin. Forest flows into it from the left; grass and moss cover descending slopes. Fruit trees dominate, larger coarse-fruited growth at the rim and tiny rosy apple trees among them. Tiny trees fill intervals like brushwood. The small fruit nourishes children and Vane; giant food includes large unpalatable green apples, tubers and bulbs.&quot;,&quot;Children hide among small growth and warm Vane at night; Lona brings babies from the wood. They have no ordinary counting of age and have never seen water until tears, though the region shows ancient water and offers hidden-water sounds. Their country is bound up with identity. Mara later confirms the receiving-lake history. Vane expects the lake to refill; the final shoreline and the survival or relocation of every orchard tree are not narrated.&quot;]},&quot;palace&quot;:{&quot;id&quot;:&quot;palace&quot;,&quot;title&quot;:&quot;Elevated fortress-palace and outer defenses&quot;,&quot;state&quot;:&quot;Dry city / observed architecture&quot;,&quot;refs&quot;:[&quot;24.011&quot;,&quot;24.017&quot;,&quot;25.001&quot;,&quot;36.008&quot;],&quot;paragraphs&quot;:[&quot;The palace stands high over the city’s heart, approached by a steep way, with many defenses and partly ruined neglected fortifications. Great gates remain open. A drawbridge-like crossing spans a rocky ravine/chasm used as moat; Vane doubts it ever contained water. A recessed stone bench outside shelters him at night.&quot;,&quot;Inside is a paved court/grove of regularly spaced towering poplar-like stems, with one still taller center tree. The palace is long and low with high corner towers and a great central dome only half the towers’ height. A low half-elliptical central front arch enters the vestibule. Its suggested Indian origin is Vane’s analogy, not permission to import an Indian palace plan.&quot;]},&quot;palace-passages&quot;:{&quot;id&quot;:&quot;palace-passages&quot;,&quot;title&quot;:&quot;Vestibule, restraint cage, kitchen, and irregular passages&quot;,&quot;state&quot;:&quot;Dry palace interiors&quot;,&quot;refs&quot;:[&quot;25.001&quot;,&quot;25.019&quot;,&quot;26.012&quot;],&quot;paragraphs&quot;:[&quot;A longish elliptical vestibule has the spotted leopardess’s cage to one side, muzzle, restraining paw mitts and collar. Two low passages lead into many narrow irregular branches; a page guides Vane. A large kitchen contains servants and provisions. The exact passages, room locations, levels and correspondence to exterior corner towers remain undescribed.&quot;,&quot;A later nocturnal encounter seems to show the beast leaving yet also remaining in the cage. That double appearance must not become a second ordinary animal cage or a duplicated palace wing without explicit labeling.&quot;]},&quot;palace-tree&quot;:{&quot;id&quot;:&quot;palace-tree&quot;,&quot;title&quot;:&quot;Courtyard’s tallest tree and fountain passage&quot;,&quot;state&quot;:&quot;Dry city / Earth transition&quot;,&quot;refs&quot;:[&quot;25.001&quot;,&quot;27.013&quot;,&quot;27.018&quot;,&quot;27.031&quot;,&quot;28.001&quot;,&quot;30.004&quot;],&quot;paragraphs&quot;:[&quot;The central court tree has branches gathering their ends into a fir-cone-like crown and trunk projections resembling old palm leaf bases. Lilith claims a healing blossom and dangerous snake at the top; Vane never verifies either. Cold increases as he climbs despite little wind and unmoving branches. Near the top support feels unstable, then he is drenched and flung into the earthly fountain basin.&quot;,&quot;Adam explains that Lilith touched Vane’s wrapped feet throughout the ascent, gaining contact needed to reenter Earth and bypass the hot-stream prohibition. The hundred-foot height is the fountain jet in the ensuing Earth scene, not a measured height of this tree.&quot;]},&quot;pine-portal&quot;:{&quot;id&quot;:&quot;pine-portal&quot;,&quot;title&quot;:&quot;First pine wood, shimmer, and overlapping forest&quot;,&quot;state&quot;:&quot;Dry country / cross-world overlap&quot;,&quot;refs&quot;:[&quot;03.040&quot;,&quot;03.042&quot;,&quot;04.050&quot;,&quot;04.056&quot;,&quot;04.064&quot;,&quot;05.001&quot;],&quot;paragraphs&quot;:[&quot;Tall slender fragrant pines hold twilight gloom. A shimmer between two trunks resembles heat haze, disappears near at hand, and gives uncertain sight of trees beyond. Passing it returns Vane to the wooden mirror chamber. A separate garden-following episode also ends in a pine forest, but the exact identity of each stretch is not surveyed.&quot;,&quot;Raven’s seven-dimensional explanation places a large tree about thirty yards left on the kitchen hearth, a piano-player across the path to it, a rosebush beside her, and hyacinths among the strings. As the party proceeds, trees grow larger, older and more grotesque before thinning into open heath. These are co-located perceptions, not a conventional forest encircling the house at measured setbacks.&quot;]},&quot;plain&quot;:{&quot;id&quot;:&quot;plain&quot;,&quot;title&quot;:&quot;Grassy plain between forest-edge stream and Bulika&quot;,&quot;state&quot;:&quot;Dry country / pursuit and marches&quot;,&quot;refs&quot;:[&quot;20.001&quot;,&quot;20.018&quot;,&quot;21.001&quot;,&quot;22.004&quot;,&quot;34.013&quot;,&quot;35.001&quot;,&quot;38.001&quot;],&quot;paragraphs&quot;:[&quot;Beyond the stream grass thickens toward a far green horizon. Leaving it, Lilith crosses a gentle upslope; Vane follows across thick soft grass for a whole day. The two cats pursue the same line. A fleeing mother travels on a parallel line with an infant. No named highway, compass bearing or mile count is supplied.&quot;,&quot;Children had reported smooth green country without rocks or trees toward the moonrise side beyond their wood. The army later crosses silent levels of short grass, carrying hay because elephants cannot gather enough of the short blades. Rest and night-march stages, supernatural fauna and uncertain sky cycles prevent exact distance conversion. Outside Bulika the grass grows thicker and softer at the temporary camp.&quot;]},&quot;restored-upper&quot;:{&quot;id&quot;:&quot;restored-upper&quot;,&quot;title&quot;:&quot;Renewed upper river, grassland, rivulets, and greater forest&quot;,&quot;state&quot;:&quot;After true awakening&quot;,&quot;refs&quot;:[&quot;45.008&quot;,&quot;45.010&quot;,&quot;45.011&quot;,&quot;45.013&quot;,&quot;46.001&quot;],&quot;paragraphs&quot;:[&quot;Above the flowing cataract, the old sandy desert is grassy plain with a broad deep quiet brim-full river, swum by children and animals. Forests have flowering shrub undergrowth, songbirds and a rivulet from every thicket. The burial place has vanished; the river comes from far beyond. The party follows upstream, with sweeter grass, lovelier flowers and larger trees.&quot;,&quot;The greatest forest’s thick arched canopy scarcely admits sunshine through leaves and blossoms. Children climb into an airy vault of branches; elephants answer from below, squirrels play, birds are friendly, and no monkeys appear. The next highest-tree lookout reveals the mountain city across a plain. No text proves this greater forest is exactly the former nest wood.&quot;]},&quot;second-branch&quot;:{&quot;id&quot;:&quot;second-branch&quot;,&quot;title&quot;:&quot;Second dry river branch and upward bank route&quot;,&quot;state&quot;:&quot;Dry → restored&quot;,&quot;refs&quot;:[&quot;11.015&quot;,&quot;12.001&quot;,&quot;14.025&quot;,&quot;15.068&quot;,&quot;16.004&quot;],&quot;paragraphs&quot;:[&quot;On emerging from Evil Wood, Vane crosses another network of dry channels. He initially fears he has reversed direction, then supposes another branch; the later scaur view confirms two branches. A broad mossy channel offers a sleeping place, and he hears water with his head to the ground. Shrub-like vegetation and dwarf fruit trees increase toward the former lake basin.&quot;,&quot;After leaving the children he travels up this branch, whose bank eventually leads toward Mara and the old cataract route. The return from the nest village crosses a branch described as left from that traveler’s viewpoint. No text fixes all these local left/right words to a universal north-up orientation.&quot;]},&quot;sexton&quot;:{&quot;id&quot;:&quot;sexton&quot;,&quot;title&quot;:&quot;Sexton’s cottage&quot;,&quot;state&quot;:&quot;Dry country / House of Sleep entrance&quot;,&quot;refs&quot;:[&quot;06.009&quot;,&quot;06.045&quot;,&quot;06.071&quot;,&quot;40.059&quot;,&quot;41.014&quot;,&quot;42.021&quot;,&quot;44.075&quot;],&quot;paragraphs&quot;:[&quot;A small cottage with central deal table, candle, wall cupboard of bread and wine, and an inner door resembling a coffin lid. Eve stands before that door at the first arrival. A later visit specifies a clay floor. Doorway and window lights guide travelers; animals shelter or wait outside.&quot;,&quot;This is not an ordinary inn where Vane may stay awake overnight as a halfway guest. Passing the inner threshold enters the immense cold sleeping room. On his last solitary return the front room is empty, but the inner coffin-door moves. Horse and elephants wait by the outer door on the final departure.&quot;]},&quot;sleep&quot;:{&quot;id&quot;:&quot;sleep&quot;,&quot;title&quot;:&quot;House of Death / House of Sleep / great chamber&quot;,&quot;state&quot;:&quot;Persistent place, changing occupants&quot;,&quot;refs&quot;:[&quot;07.001&quot;,&quot;07.010&quot;,&quot;40.083&quot;,&quot;40.106&quot;,&quot;40.121&quot;,&quot;40.157&quot;,&quot;42.068&quot;,&quot;44.054&quot;],&quot;paragraphs&quot;:[&quot;An immense still room entered through the cottage’s inner door, with ice-like cold and pure air. Innumerable separate couches form aisles, heads toward the passages, white sheets over sleepers. Moonlight enters wall openings and gives a bluish frozen appearance. Vane cannot grasp its total outline: cathedral nave and huge barn are alternate impressions. Mara calls it the biggest room in the world, with future little nests, but no measurable dimensions follow.&quot;,&quot;Three empty couches lie by a woman with a wounded hand and a middle-aged man, later identified as Vane’s parents. Lona takes the middle empty couch, Lilith the couch to her right; Vane eventually sleeps beside his mother and Lona. The explicit local family sequence is father–mother–Vane–Lona–Lilith, or its mirror reversal. No cardinal axis is supplied.&quot;,&quot;Children share occupied women’s couches and those of Vane’s parents rather than inhabiting a separate new nursery wing. Two boys lie on either side of Lilith; the rescued white leopardess is laid across her feet, forepaws outstretched and head between them. At the true awakening many children rise, but Peter, Crispy, Lilith and the white cat remain sleeping. The parents have already departed, though a dreaming Vane earlier thought everyone gone.&quot;,&quot;The Shadow cannot enter or hurt those within. Lilith and the Shadow are expected to wake last. Low horizontal crypt-like windows are first specified in the dream excursion, so retain that qualification if illustrating the waking room. Lona simultaneously seems to emerge and is already asleep on her couch: the text explicitly resists treating every apparition as bodily displacement.&quot;]},&quot;square&quot;:{&quot;id&quot;:&quot;square&quot;,&quot;title&quot;:&quot;Bulika’s central square and bat pillar&quot;,&quot;state&quot;:&quot;Dry city / route hub&quot;,&quot;refs&quot;:[&quot;22.008&quot;,&quot;35.007&quot;,&quot;35.014&quot;,&quot;36.023&quot;],&quot;paragraphs&quot;:[&quot;An early small square contains a pillar topped with a hideous bat-like figure. During the army occupation a central square serves as camp; a narrow lane directly connects it to the palace. After Lona’s death Vane rests at the pillar base in the now-empty square. The repeated route and pillar support identifying these scenes as the same square, but that identity is contextual rather than a repeated street address.&quot;,&quot;The gate-to-square-to-palace sequence is secure. Its cardinal position, the shape of the plaza, the lane length and the orientation of the bat figure are not specified.&quot;]},&quot;water-trail&quot;:{&quot;id&quot;:&quot;water-trail&quot;,&quot;title&quot;:&quot;Channel-less water from the wounded leopardess&quot;,&quot;state&quot;:&quot;Transient observed water&quot;,&quot;refs&quot;:[&quot;21.005&quot;,&quot;21.020&quot;,&quot;22.001&quot;,&quot;22.003&quot;],&quot;paragraphs&quot;:[&quot;A spotted leopardess wounded in the left forepaw leaves a copious flow Vane first mistakes for blood. Testing proves it water. It murmurs across grass without a channel, with force at his ankles. He follows it toward Bulika; at dawn it stops short of the walls, leaving bent grass and little pools. Its permanence and subsequent course are not established. A fixed blue river on a map would overstate this evidence.&quot;]}},&quot;source&quot;:{&quot;01.001&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;I had just finished my studies at Oxford, and was taking a brief holiday from work before assuming definitely the management of the estate. My father died when I was yet a child; my mother followed him within a year; and I was nearly as much alone in the world as a man might find himself.&quot;,&quot;id&quot;:&quot;01.001&quot;,&quot;chapter&quot;:1,&quot;paragraph&quot;:1,&quot;source_line&quot;:162,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0001&quot;},&quot;01.003&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;The house as well as the family was of some antiquity, but no description of it is necessary to the understanding of my narrative. It contained a fine library, whose growth began before the invention of printing, and had continued to my own time, greatly influenced, of course, by changes of taste and pursuit. Nothing surely can more impress upon a man the transitory nature of possession than his succeeding to an ancient property! Like a moving panorama mine has passed from before many eyes, and is now slowly flitting from before my own.&quot;,&quot;id&quot;:&quot;01.003&quot;,&quot;chapter&quot;:1,&quot;paragraph&quot;:3,&quot;source_line&quot;:182,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0001&quot;},&quot;01.009&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;In one of the walls was the low, narrow door of a closet, containing some of the oldest and rarest of the books. It was a very thick door, with a projecting frame, and it had been the fancy of some ancestor to cross it with shallow shelves, filled with book-backs only. The harmless trick may be excused by the fact that the titles on the sham backs were either humorously original, or those of books lost beyond hope of recovery. I had a great liking for the masked door.&quot;,&quot;id&quot;:&quot;01.009&quot;,&quot;chapter&quot;:1,&quot;paragraph&quot;:9,&quot;source_line&quot;:242,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0001&quot;},&quot;02.003&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;But I had for some time intended a thorough overhauling of the books in the closet, its atmosphere causing me uneasiness as to their condition. One day the intention suddenly became a resolve, and I was in the act of rising from my chair to make a beginning, when I saw the old librarian moving from the door of the closet toward the farther end of the room. I ought rather to say only that I caught sight of something shadowy from which I received the impression of a slight, stooping man, in a shabby dress-coat reaching almost to his heels, the tails of which, disparting a little as he walked, revealed thin legs in black stockings, and large feet in wide, slipper-like shoes.&quot;,&quot;id&quot;:&quot;02.003&quot;,&quot;chapter&quot;:2,&quot;paragraph&quot;:3,&quot;source_line&quot;:369,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0002&quot;},&quot;02.008&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;The small chamber was full of light, but such as dwells in places deserted: it had a dull, disconsolate look, as if it found itself of no use, and regretted having come. A few rather dim sunrays, marking their track through the cloud of motes that had just been stirred up, fell upon a tall mirror with a dusty face, old-fashioned and rather narrow—in appearance an ordinary glass. It had an ebony frame, on the top of which stood a black eagle, with outstretched wings, in his beak a golden chain, from whose end hung a black ball.&quot;,&quot;id&quot;:&quot;02.008&quot;,&quot;chapter&quot;:2,&quot;paragraph&quot;:8,&quot;source_line&quot;:414,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0002&quot;},&quot;02.009&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;I had been looking at rather than into the mirror, when suddenly I became aware that it reflected neither the chamber nor my own person. I have an impression of having seen the wall melt away, but what followed is enough to account for any uncertainty:—could I have mistaken for a mirror the glass that protected a wonderful picture?&quot;,&quot;id&quot;:&quot;02.009&quot;,&quot;chapter&quot;:2,&quot;paragraph&quot;:9,&quot;source_line&quot;:424,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0002&quot;},&quot;03.001&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;I turned and looked behind me: all was vague and uncertain, as when one cannot distinguish between fog and field, between cloud and mountain-side. One fact only was plain—that I saw nothing I knew. Imagining myself involved in a visual illusion, and that touch would correct sight, I stretched my arms and felt about me, walking in this direction and that, if haply, where I could see nothing, I might yet come in contact with something; but my search was vain. Instinctively then, as to the only living thing near me, I turned to the raven, which stood a little way off, regarding me with an expression at once respectful and quizzical. Then the absurdity of seeking counsel from such a one struck me, and I turned again, overwhelmed with bewilderment, not unmingled with fear. Had I wandered into a region where both the material and psychical relations of our world had ceased to hold? Might a man at any moment step beyond the realm of order, and become the sport of the lawless? Yet I saw the raven, felt the ground under my feet, and heard a sound as of wind in the lowly plants around me!&quot;,&quot;id&quot;:&quot;03.001&quot;,&quot;chapter&quot;:3,&quot;paragraph&quot;:1,&quot;source_line&quot;:457,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0003&quot;},&quot;03.040&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;I took the way Mr. Raven had gone, and went slowly after him. Presently I saw a wood of tall slender pine-trees, and turned toward it. The odour of it met me on my way, and I made haste to bury myself in it.&quot;,&quot;id&quot;:&quot;03.040&quot;,&quot;chapter&quot;:3,&quot;paragraph&quot;:40,&quot;source_line&quot;:662,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0003&quot;},&quot;03.042&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;Terror seized me, and I fled. Outside the chamber the wide garret spaces had an UNCANNY look. They seemed to have long been waiting for something; it had come, and they were waiting again! A shudder went through me on the winding stair: the house had grown strange to me! something was about to leap upon me from behind! I darted down the spiral, struck against the wall and fell, rose and ran. On the next floor I lost my way, and had gone through several passages a second time ere I found the head of the stair. At the top of the great stair I had come to myself a little, and in a few moments I sat recovering my breath in the library.&quot;,&quot;id&quot;:&quot;03.042&quot;,&quot;chapter&quot;:3,&quot;paragraph&quot;:42,&quot;source_line&quot;:680,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0003&quot;},&quot;04.004&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;He came nearer and nearer, made a profound bow, and with a sudden winged leap stood on the window-sill. Then he stepped over the ledge, jumped down into the room, and walked to the door. I thought he was on his way to the library, and followed him, determined, if he went up the stair, not to take one step after him. He turned, however, neither toward the library nor the stair, but to a little door that gave upon a grass-patch in a nook between two portions of the rambling old house. I made haste to open it for him. He stepped out into its creeper-covered porch, and stood looking at the rain, which fell like a huge thin cataract; I stood in the door behind him. The second flash came, and was followed by a lengthened roll of more distant thunder. He turned his head over his shoulder and looked at me, as much as to say, “You hear that?” then swivelled it round again, and anew contemplated the weather, apparently with approbation. So human were his pose and carriage and the way he kept turning his head, that I remarked almost involuntarily,&quot;,&quot;id&quot;:&quot;04.004&quot;,&quot;chapter&quot;:4,&quot;paragraph&quot;:4,&quot;source_line&quot;:785,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0004&quot;},&quot;04.050&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;All about me was a pine-forest, in which my eyes were already searching deep, in the hope of discovering an unaccountable glimmer, and so finding my way home. But, alas! how could I any longer call that house HOME, where every door, every window opened into OUT, and even the garden I could not keep inside!&quot;,&quot;id&quot;:&quot;04.050&quot;,&quot;chapter&quot;:4,&quot;paragraph&quot;:50,&quot;source_line&quot;:975,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0004&quot;},&quot;04.056&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;“That you see nobody is where the danger lies. But you see that large tree to your left, about thirty yards away?”&quot;,&quot;id&quot;:&quot;04.056&quot;,&quot;chapter&quot;:4,&quot;paragraph&quot;:56,&quot;source_line&quot;:1002,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0004&quot;},&quot;04.064&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;“That tree stands on the hearth of your kitchen, and grows nearly straight up its chimney,” he said.&quot;,&quot;id&quot;:&quot;04.064&quot;,&quot;chapter&quot;:4,&quot;paragraph&quot;:64,&quot;source_line&quot;:1029,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0004&quot;},&quot;05.001&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;I followed him deep into the pine-forest. Neither of us said much while yet the sacred gloom of it closed us round. We came to larger and yet larger trees—older, and more individual, some of them grotesque with age. Then the forest grew thinner.&quot;,&quot;id&quot;:&quot;05.001&quot;,&quot;chapter&quot;:5,&quot;paragraph&quot;:1,&quot;source_line&quot;:1182,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0005&quot;},&quot;05.007&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;“The season for the hawthorn to blossom,” he replied, “is when the hawthorn blossoms. That tree is in the ruins of the church on your home-farm. You were going to give some directions to the bailiff about its churchyard, were you not, the morning of the thunder?”&quot;,&quot;id&quot;:&quot;05.007&quot;,&quot;chapter&quot;:5,&quot;paragraph&quot;:7,&quot;source_line&quot;:1204,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0005&quot;},&quot;05.009&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;“Listen!” said the raven, seeming to hold his breath.&quot;,&quot;id&quot;:&quot;05.009&quot;,&quot;chapter&quot;:5,&quot;paragraph&quot;:9,&quot;source_line&quot;:1214,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0005&quot;},&quot;05.025&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;This time the raven pointed his beak downward—to something at the foot of a block of granite. I looked, and saw a little flower. I had never seen one like it before, and cannot utter the feeling it woke in me by its gracious, trusting form, its colour, and its odour as of a new world that was yet the old. I can only say that it suggested an anemone, was of a pale rose-hue, and had a golden heart.&quot;,&quot;id&quot;:&quot;05.025&quot;,&quot;chapter&quot;:5,&quot;paragraph&quot;:25,&quot;source_line&quot;:1285,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0005&quot;},&quot;05.033&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;But I did see that the flower was different from any flower I had ever seen before; therefore I knew that I must be seeing a shadow of the prayer in it; and a great awe came over me to think of the heart listening to the flower.&quot;,&quot;id&quot;:&quot;05.033&quot;,&quot;chapter&quot;:5,&quot;paragraph&quot;:33,&quot;source_line&quot;:1320,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0005&quot;},&quot;06.001&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;We had been for some time walking over a rocky moorland covered with dry plants and mosses, when I descried a little cottage in the farthest distance. The sun was not yet down, but he was wrapt in a gray cloud. The heath looked as if it had never been warm, and the wind blew strangely cold, as if from some region where it was always night.&quot;,&quot;id&quot;:&quot;06.001&quot;,&quot;chapter&quot;:6,&quot;paragraph&quot;:1,&quot;source_line&quot;:1336,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0006&quot;},&quot;06.008&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;As we drew near the cottage, the clouded sun was rushing down the steepest slope of the west, and he sank while we were yet a few yards from the door. The same instant I was assailed by a cold that seemed almost a material presence, and I struggled across the threshold as if from the clutches of an icy death. A wind swelled up on the moor, and rushed at the door as with difficulty I closed it behind me. Then all was still, and I looked about me.&quot;,&quot;id&quot;:&quot;06.008&quot;,&quot;chapter&quot;:6,&quot;paragraph&quot;:8,&quot;source_line&quot;:1380,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0006&quot;},&quot;06.009&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;A candle burned on a deal table in the middle of the room, and the first thing I saw was the lid of a coffin, as I thought, set up against the wall; but it opened, for it was a door, and a woman entered. She was all in white—as white as new-fallen snow; and her face was as white as her dress, but not like snow, for at once it suggested warmth. I thought her features were perfect, but her eyes made me forget them. The life of her face and her whole person was gathered and concentrated in her eyes, where it became light. It might have been coming death that made her face luminous, but the eyes had life in them for a nation—large, and dark with a darkness ever deepening as I gazed. A whole night-heaven lay condensed in each pupil; all the stars were in its blackness, and flashed; while round it for a horizon lay coiled an iris of the eternal twilight. What any eye IS, God only knows: her eyes must have been coming direct out of his own! the still face might be a primeval perfection; the live eyes were a continuous creation.&quot;,&quot;id&quot;:&quot;06.009&quot;,&quot;chapter&quot;:6,&quot;paragraph&quot;:9,&quot;source_line&quot;:1389,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0006&quot;},&quot;06.045&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;“We are in want of something to eat and drink, wife,” he said; “we have come a long way!”&quot;,&quot;id&quot;:&quot;06.045&quot;,&quot;chapter&quot;:6,&quot;paragraph&quot;:45,&quot;source_line&quot;:1544,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0006&quot;},&quot;06.071&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;As we rose, the woman came in. She took up the candle, turned to the inner door, and led the way. I went close behind her, and the sexton followed.&quot;,&quot;id&quot;:&quot;06.071&quot;,&quot;chapter&quot;:6,&quot;paragraph&quot;:71,&quot;source_line&quot;:1643,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0006&quot;},&quot;07.001&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;The air as of an ice-house met me crossing the threshold. The door fell-to behind us. The sexton said something to his wife that made her turn toward us.—What a change had passed upon her! It was as if the splendour of her eyes had grown too much for them to hold, and, sinking into her countenance, made it flash with a loveliness like that of Beatrice in the white rose of the redeemed. Life itself, life eternal, immortal, streamed from it, an unbroken lightning. Even her hands shone with a white radiance, every “pearl-shell helmet” gleaming like a moonstone. Her beauty was overpowering; I was glad when she turned it from me.&quot;,&quot;id&quot;:&quot;07.001&quot;,&quot;chapter&quot;:7,&quot;paragraph&quot;:1,&quot;source_line&quot;:1657,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0007&quot;},&quot;07.010&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;We came at last to three empty couches, immediately beyond which lay the form of a beautiful woman, a little past the prime of life. One of her arms was outside the sheet, and her hand lay with the palm upward, in its centre a dark spot. Next to her was the stalwart figure of a man of middle age. His arm too was outside the sheet, the strong hand almost closed, as if clenched on the grip of a sword. I thought he must be a king who had died fighting for the truth.&quot;,&quot;id&quot;:&quot;07.010&quot;,&quot;chapter&quot;:7,&quot;paragraph&quot;:10,&quot;source_line&quot;:1746,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0007&quot;},&quot;07.015&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;“I cannot answer you,” he replied in a subdued voice. “I almost forget what they mean by DEAD in the old world. If I said a person was dead, my wife would understand one thing, and you would imagine another.—This is but one of my treasure vaults,” he went on, “and all my guests are not laid in vaults: out there on the moor they lie thick as the leaves of a forest after the first blast of your winter—thick, let me say rather, as if the great white rose of heaven had shed its petals over it. All night the moon reads their faces, and smiles.”&quot;,&quot;id&quot;:&quot;07.015&quot;,&quot;chapter&quot;:7,&quot;paragraph&quot;:15,&quot;source_line&quot;:1769,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0007&quot;},&quot;07.020&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;“None of those you see,” he answered, “are in truth quite dead yet, and some have but just begun to come alive and die. Others had begun to die, that is to come alive, long before they came to us; and when such are indeed dead, that instant they will wake and leave us. Almost every night some rise and go. But I will not say more, for I find my words only mislead you!—This is the couch that has been waiting for you,” he ended, pointing to one of the three.&quot;,&quot;id&quot;:&quot;07.020&quot;,&quot;chapter&quot;:7,&quot;paragraph&quot;:20,&quot;source_line&quot;:1805,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0007&quot;},&quot;07.040&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;They went farther into the great chamber, and I was left alone in the moonlight with the dead.&quot;,&quot;id&quot;:&quot;07.040&quot;,&quot;chapter&quot;:7,&quot;paragraph&quot;:40,&quot;source_line&quot;:1889,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0007&quot;},&quot;07.046&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;In the library was one small window to the east, through which, at this time of the year, the first rays of the sun shone upon a mirror whence they were reflected on the masked door: when I woke, there they shone, and thither they drew my eyes. With the feeling that behind it must lie the boundless chamber I had left by that door, I sprang to my feet, and opened it. The light, like an eager hound, shot before me into the closet, and pounced upon the gilded edges of a large book.&quot;,&quot;id&quot;:&quot;07.046&quot;,&quot;chapter&quot;:7,&quot;paragraph&quot;:46,&quot;source_line&quot;:1916,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0007&quot;},&quot;07.048&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;But the gilded edges, reflecting the light a second time, flung it on a nest of drawers in a dark corner, and I saw that one of them was half open.&quot;,&quot;id&quot;:&quot;07.048&quot;,&quot;chapter&quot;:7,&quot;paragraph&quot;:48,&quot;source_line&quot;:1928,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0007&quot;},&quot;07.050&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;It contained old papers, and seemed more than full, for it would not close. Taking the topmost one out, I perceived that it was in my father’s writing and of some length. The words on which first my eyes fell, at once made me eager to learn what it contained. I carried it to the library, sat down in one of the western windows, and read what follows.&quot;,&quot;id&quot;:&quot;07.050&quot;,&quot;chapter&quot;:7,&quot;paragraph&quot;:50,&quot;source_line&quot;:1936,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0007&quot;},&quot;08.019&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;“I owe him much,” he continued; “for, although I had read many more books than he, yet, through the special direction of his studies, he was able to inform me of a certain relation of modes which I should never have discovered of myself, and could hardly have learned from any one else.”&quot;,&quot;id&quot;:&quot;08.019&quot;,&quot;chapter&quot;:8,&quot;paragraph&quot;:19,&quot;source_line&quot;:2034,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0008&quot;},&quot;08.029&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;“Not throughout; but so much another that most of its physical, and many of its mental laws are different from those of this world. As for moral laws, they must everywhere be fundamentally the same.”&quot;,&quot;id&quot;:&quot;08.029&quot;,&quot;chapter&quot;:8,&quot;paragraph&quot;:29,&quot;source_line&quot;:2090,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0008&quot;},&quot;08.044&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;He rose, left the library, crossed the hall, and went straight up to the garret, familiar evidently with every turn. I followed, studying his back. His hair hung down long and dark, straight and glossy. His coat was wide and reached to his heels. His shoes seemed too large for him.&quot;,&quot;id&quot;:&quot;08.044&quot;,&quot;chapter&quot;:8,&quot;paragraph&quot;:44,&quot;source_line&quot;:2148,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0008&quot;},&quot;08.055&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;Suddenly I was aware that our forms had gone from the mirror, which seemed full of a white mist. As I gazed I saw, growing gradually visible beyond the mist, the tops of a range of mountains, which became clearer and clearer. Soon the mist vanished entirely, uncovering the face of a wide heath, on which, at some distance, was the figure of a man moving swiftly away. I turned to address my companion; he was no longer by my side. I looked again at the form in the mirror, and recognised the wide coat flying, the black hair lifting in a wind that did not touch me. I rushed in terror from the place.&quot;,&quot;id&quot;:&quot;08.055&quot;,&quot;chapter&quot;:8,&quot;paragraph&quot;:55,&quot;source_line&quot;:2213,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0008&quot;},&quot;09.001&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;I laid the manuscript down, consoled to find that my father had had a peep into that mysterious world, and that he knew Mr. Raven.&quot;,&quot;id&quot;:&quot;09.001&quot;,&quot;chapter&quot;:9,&quot;paragraph&quot;:1,&quot;source_line&quot;:2234,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0009&quot;},&quot;09.007&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;All I knew of the way to the cottage was that we had gone through a pine-forest. I passed through many thickets and several small fir-woods, continually fancying afresh that I recognised something of the country; but I had come upon no forest, and now the sun was near the horizon, and the air had begun to grow chill with the coming winter, when, to my delight, I saw a little black object coming toward me: it was indeed the raven!&quot;,&quot;id&quot;:&quot;09.007&quot;,&quot;chapter&quot;:9,&quot;paragraph&quot;:7,&quot;source_line&quot;:2282,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0009&quot;},&quot;09.024&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;“No; he is still in the Evil Wood, fighting the dead.”&quot;,&quot;id&quot;:&quot;09.024&quot;,&quot;chapter&quot;:9,&quot;paragraph&quot;:24,&quot;source_line&quot;:2358,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0009&quot;},&quot;09.029&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;“Then,” I said, feeling naked and very worthless, “will you be so good as show me the nearest way home? There are more ways than one, I know, for I have gone by two already.”&quot;,&quot;id&quot;:&quot;09.029&quot;,&quot;chapter&quot;:9,&quot;paragraph&quot;:29,&quot;source_line&quot;:2378,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0009&quot;},&quot;10.005&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;As I walked, my feet lost the heather, and trod a bare spongy soil, something like dry, powdery peat. To my dismay it gave a momentary heave under me; then presently I saw what seemed the ripple of an earthquake running on before me, shadowy in the low moon. It passed into the distance; but, while yet I stared after it, a single wave rose up, and came slowly toward me. A yard or two away it burst, and from it, with a scramble and a bound, issued an animal like a tiger. About his mouth and ears hung clots of mould, and his eyes winked and flamed as he rushed at me, showing his white teeth in a soundless snarl. I stood fasci
