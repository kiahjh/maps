nated, unconscious of either courage or fear. He turned his head to the ground, and plunged into it.&quot;,&quot;id&quot;:&quot;10.005&quot;,&quot;chapter&quot;:10,&quot;paragraph&quot;:5,&quot;source_line&quot;:2542,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0010&quot;},&quot;10.012&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;I was drawing near the hills I had made my goal, and she was now not far from their sky-line, when the soundless wallowing ceased, and the burrow lay motionless and bare. Then I saw, slowly walking over the light soil, the form of a woman. A white mist floated about her, now assuming, now losing to reassume the shape of a garment, as it gathered to her or was blown from her by a wind that dogged her steps.&quot;,&quot;id&quot;:&quot;10.012&quot;,&quot;chapter&quot;:10,&quot;paragraph&quot;:12,&quot;source_line&quot;:2603,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0010&quot;},&quot;10.015&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;I was already on the slope of their base, when the moon sank behind one of their summits, leaving me in its shadow. Behind me rose a waste and sickening cry, as of frustrate desire—the only sound I had heard since the fall of the dead butterfly; it made my heart shake like a flag in the wind. I turned, saw many dark objects bounding after me, and made for the crest of a ridge on which the moon still shone. She seemed to linger there that I might see to defend myself. Soon I came in sight of her, and climbed the faster.&quot;,&quot;id&quot;:&quot;10.015&quot;,&quot;chapter&quot;:10,&quot;paragraph&quot;:15,&quot;source_line&quot;:2631,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0010&quot;},&quot;10.017&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;I climbed to the top of the ridge: far away shone the moon, sinking to a low horizon. The air was pure and strong. I descended a little way, found it warmer, and sat down to wait the dawn.&quot;,&quot;id&quot;:&quot;10.017&quot;,&quot;chapter&quot;:10,&quot;paragraph&quot;:17,&quot;source_line&quot;:2650,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0010&quot;},&quot;11.001&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;I fell fast asleep, and when I woke the sun was rising. I went to the top again, and looked back: the hollow I had crossed in the moonlight lay without sign of life. Could it be that the calm expanse before me swarmed with creatures of devouring greed?&quot;,&quot;id&quot;:&quot;11.001&quot;,&quot;chapter&quot;:11,&quot;paragraph&quot;:1,&quot;source_line&quot;:2668,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0011&quot;},&quot;11.004&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;When I reached the plain, I found it, as far as my sight could go, of rock, here flat and channeled, there humped and pinnacled—evidently the wide bed of a vanished river, scored by innumerable water-runs, without a trace of moisture in them. Some of the channels bore a dry moss, and some of the rocks a few lichens almost as hard as themselves. The air, once “filled with pleasant noise of waters,” was silent as death. It took me the whole day to reach the patch,—which I found indeed a forest—but not a rudiment of brook or runnel had I crossed! Yet through the glowing noon I seemed haunted by an aural mirage, hearing so plainly the voice of many waters that I could hardly believe the opposing testimony of my eyes.&quot;,&quot;id&quot;:&quot;11.004&quot;,&quot;chapter&quot;:11,&quot;paragraph&quot;:4,&quot;source_line&quot;:2685,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0011&quot;},&quot;11.005&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;The sun was approaching the horizon when I left the river-bed, and entered the forest. Sunk below the tree-tops, and sending his rays between their pillar-like boles, he revealed a world of blessed shadows waiting to receive me. I had expected a pine-wood, but here were trees of many sorts, some with strong resemblances to trees I knew, others with marvellous differences from any I had ever seen. I threw myself beneath the boughs of what seemed a eucalyptus in blossom: its flowers had a hard calyx much resembling a skull, the top of which rose like a lid to let the froth-like bloom-brain overfoam its cup. From beneath the shadow of its falchion-leaves my eyes went wandering into deep after deep of the forest.&quot;,&quot;id&quot;:&quot;11.005&quot;,&quot;chapter&quot;:11,&quot;paragraph&quot;:5,&quot;source_line&quot;:2697,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0011&quot;},&quot;11.009&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;It was still dark when I began to be aware of a far-off, confused, rushing noise, mingled with faint cries. It grew and grew until a tumult as of gathering multitudes filled the wood. On all sides at once the sounds drew nearer; the spot where I lay seemed the centre of a commotion that extended throughout the forest. I scarce moved hand or foot lest I should betray my presence to hostile things.&quot;,&quot;id&quot;:&quot;11.009&quot;,&quot;chapter&quot;:11,&quot;paragraph&quot;:9,&quot;source_line&quot;:2744,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0011&quot;},&quot;11.014&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;I rose and resumed my journey, through as quiet a wood as ever grew out of the quiet earth. For the wind of the morning had ceased when the sun appeared, and the trees were silent. Not a bird sang, not a squirrel, mouse, or weasel showed itself, not a belated moth flew athwart my path. But as I went I kept watch over myself, nor dared let my eyes rest on any forest-shape. All the time I seemed to hear faint sounds of mattock and spade and hurtling bones: any moment my eyes might open on things I would not see! Daylight prudence muttered that perhaps, to appear, ten thousand phantoms awaited only my consenting fancy.&quot;,&quot;id&quot;:&quot;11.014&quot;,&quot;chapter&quot;:11,&quot;paragraph&quot;:14,&quot;source_line&quot;:2797,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0011&quot;},&quot;11.015&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;In the middle of the afternoon I came out of the wood—to find before me a second net of dry water-courses. I thought at first that I had wandered from my attempted line, and reversed my direction; but I soon saw it was not so, and concluded presently that I had come to another branch of the same river-bed. I began at once to cross it, and was in the bottom of a wide channel when the sun set.&quot;,&quot;id&quot;:&quot;11.015&quot;,&quot;chapter&quot;:11,&quot;paragraph&quot;:15,&quot;source_line&quot;:2808,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0011&quot;},&quot;12.001&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;Coming, in one of the channels, upon what seemed a little shrub, the outlying picket, I trusted, of an army behind it, I knelt to look at it closer. It bore a small fruit, which, as I did not recognise it, I feared to gather and eat. Little I thought that I was watched from behind the rocks by hundreds of eyes eager with the question whether I would or would not take it.&quot;,&quot;id&quot;:&quot;12.001&quot;,&quot;chapter&quot;:12,&quot;paragraph&quot;:1,&quot;source_line&quot;:2844,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0012&quot;},&quot;12.003&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;I came next to some large fruit-bearing trees, but what they bore looked coarse. They stood on the edge of a hollow, which evidently had once been the basin of a lake. From the left a forest seemed to flow into and fill it; but while the trees above were of many sorts, those in the hollow were almost entirely fruit-bearing.&quot;,&quot;id&quot;:&quot;12.003&quot;,&quot;chapter&quot;:12,&quot;paragraph&quot;:3,&quot;source_line&quot;:2860,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0012&quot;},&quot;12.024&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;They dragged me into the wood above the valley, where their tribe lived—in wretched huts, built of fallen branches and a few stones. Into one of these they pushed me, there threw me on the ground, and kicked me. A woman was present, who looked on with indifference.&quot;,&quot;id&quot;:&quot;12.024&quot;,&quot;chapter&quot;:12,&quot;paragraph&quot;:24,&quot;source_line&quot;:2972,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0012&quot;},&quot;13.001&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;I had been at work but a few moments, when I heard small voices near me, and presently the Little Ones, as I soon found they called themselves, came creeping out from among the tiny trees that like brushwood filled the spaces between the big ones. In a minute there were scores and scores about me. I made signs that the giants had but just left me, and were not far off; but they laughed, and told me the wind was quite clean.&quot;,&quot;id&quot;:&quot;13.001&quot;,&quot;chapter&quot;:13,&quot;paragraph&quot;:1,&quot;source_line&quot;:3014,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0013&quot;},&quot;13.020&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;“Where did you find him?” I asked.&quot;,&quot;id&quot;:&quot;13.020&quot;,&quot;chapter&quot;:13,&quot;paragraph&quot;:20,&quot;source_line&quot;:3126,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0013&quot;},&quot;13.069&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;None of them put a hand to my work: they would do nothing for the giants! But they never relaxed their loving ministrations to me. They would sing to me, one after another, for hours; climb the tree to reach my mouth and pop fruit into it with their dainty little fingers; and they kept constant watch against the approach of a giant.&quot;,&quot;id&quot;:&quot;13.069&quot;,&quot;chapter&quot;:13,&quot;paragraph&quot;:69,&quot;source_line&quot;:3299,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0013&quot;},&quot;13.110&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;“Then you do not know where the babies come from into the wood?” I said, making one attempt more.&quot;,&quot;id&quot;:&quot;13.110&quot;,&quot;chapter&quot;:13,&quot;paragraph&quot;:110,&quot;source_line&quot;:3474,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0013&quot;},&quot;14.001&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;For a time I had no desire save to spend my life with the Little Ones. But soon other thoughts and feelings began to influence me. First awoke the vague sense that I ought to be doing something; that I was not meant for the fattening of boors! Then it came to me that I was in a marvellous world, of which it was assuredly my business to discover the ways and laws; and that, if I would do anything in return for the children’s goodness, I must learn more about them than they could tell me, and to that end must be free. Surely, I thought, no suppression of their growth can be essential to their loveliness and truth and purity! Not in any world could the possibility exist of such a discord between constitution and its natural outcome! Life and law cannot be so at variance that perfection must be gained by thwarting development! But the growth of the Little Ones WAS arrested! something interfered with it: what was it? Lona seemed the eldest of them, yet not more than fifteen, and had been long in charge of a multitude, in semblance and mostly in behaviour merest children, who regarded her as their mother! Were they growing at all? I doubted it. Of time they had scarcely the idea; of their own age they knew nothing! Lona herself thought she had lived always! Full of wisdom and empty of knowledge, she was at once their Love and their Law! But what seemed to me her ignorance might in truth be my own lack of insight! Her one anxiety plainly was, that her Little Ones should not grow, and change into bad giants! Their “good giant” was bound to do his best for them: without more knowledge of their nature, and some knowledge of their history, he could do nothing, and must therefore leave them! They would only be as they were before; they had in no way become dependent on me; they were still my protectors, I was not theirs; my presence but brought them more in danger of their idiotic neighbours! I longed to teach them many things: I must first understand more of those I would teach! Knowledge no doubt made bad people worse, but it must make good people better! I was convinced they would learn mathematics; and might they not be taught to write down the dainty melodies they murmured and forgot?&quot;,&quot;id&quot;:&quot;14.001&quot;,&quot;chapter&quot;:14,&quot;paragraph&quot;:1,&quot;source_line&quot;:3551,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0014&quot;},&quot;14.021&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;I questioned those about me as we walked, and learned there was a great place with a giant-girl for queen. When I asked if it was a city, they said they did not know. Neither could they tell how far off, or in what direction it was, or what was the giant-girl’s name; all they knew was, that she hated the Little Ones, and would like to kill them, only she could not find them. I asked how they knew that; Lona answered that she had always known it. If the giant-girl came to look for them, they must hide hard, she said. When I told them I should go and ask her why she hated them, they cried out,&quot;,&quot;id&quot;:&quot;14.021&quot;,&quot;chapter&quot;:14,&quot;paragraph&quot;:21,&quot;source_line&quot;:3683,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0014&quot;},&quot;14.025&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;They were taking me up the second branch of the river bed: when they saw that the moon had reached her height, they stopped to return.&quot;,&quot;id&quot;:&quot;14.025&quot;,&quot;chapter&quot;:14,&quot;paragraph&quot;:25,&quot;source_line&quot;:3707,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0014&quot;},&quot;15.001&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;I travelled on attended by the moon. As usual she was full—I had never seen her other—and to-night as she sank I thought I perceived something like a smile on her countenance.&quot;,&quot;id&quot;:&quot;15.001&quot;,&quot;chapter&quot;:15,&quot;paragraph&quot;:1,&quot;source_line&quot;:3771,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0015&quot;},&quot;15.035&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;We had left the channels and walked a long time, but no sign of the cottage yet appeared.&quot;,&quot;id&quot;:&quot;15.035&quot;,&quot;chapter&quot;:15,&quot;paragraph&quot;:35,&quot;source_line&quot;:3927,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0015&quot;},&quot;15.036&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;“The Little Ones told me,” I said at length, “of a smooth green country, pleasant to the feet!”&quot;,&quot;id&quot;:&quot;15.036&quot;,&quot;chapter&quot;:15,&quot;paragraph&quot;:36,&quot;source_line&quot;:3931,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0015&quot;},&quot;15.039&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;“There is a city in that grassy land,” she replied, “where a woman is princess. The city is called Bulika. But certainly the princess is not a girl! She is older than this world, and came to it from yours—with a terrible history, which is not over yet. She is an evil person, and prevails much with the Prince of the Power of the Air. The people of Bulika were formerly simple folk, tilling the ground and pasturing sheep. She came among them, and they received her hospitably. She taught them to dig for diamonds and opals and sell them to strangers, and made them give up tillage and pasturage and build a city. One day they found a huge snake and killed it; which so enraged her that she declared herself their princess, and became terrible to them. The name of the country at that time was THE LAND OF WATERS; for the dry channels, of which you have crossed so many, were then overflowing with live torrents; and the valley, where now the Bags and the Lovers have their fruit-trees, was a lake that received a great part of them. But the wicked princess gathered up in her lap what she could of the water over the whole country, closed it in an egg, and carried it away. Her lap, however, would not hold more than half of it; and the instant she was gone, what she had not yet taken fled away underground, leaving the country as dry and dusty as her own heart. Were it not for the waters under it, every living thing would long ago have perished from it. For where no water is, no rain falls; and where no rain falls, no springs rise. Ever since then, the princess has lived in Bulika, holding the inhabitants in constant terror, and doing what she can to keep them from multiplying. Yet they boast and believe themselves a prosperous, and certainly are a self-satisfied people—good at bargaining and buying, good at selling and cheating; holding well together for a common interest, and utterly treacherous where interests clash; proud of their princess and her power, and despising every one they get the better of; never doubting themselves the most honourable of all the nations, and each man counting himself better than any other. The depth of their worthlessness and height of their vainglory no one can understand who has not been there to see, who has not learned to know the miserable misgoverned and self-deceived creatures.”&quot;,&quot;id&quot;:&quot;15.039&quot;,&quot;chapter&quot;:15,&quot;paragraph&quot;:39,&quot;source_line&quot;:3942,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0015&quot;},&quot;15.050&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;We went on and on, and crossed yet a wide tract of sand before reaching the cottage. Its foundation stood in deep sand, but I could see that it was a rock. In character the cottage resembled the sexton’s, but had thicker walls. The door, which was heavy and strong, opened immediately into a large bare room, which had two little windows opposite each other, without glass. My hostess walked in at the open door out of which the moon had looked, and going straight to the farthest corner, took a long white cloth from the floor, and wound it about her head and face. Then she closed the other door, in at which the moon had looked, trimmed a small horn lantern that stood on the hearth, and turned to receive me.&quot;,&quot;id&quot;:&quot;15.050&quot;,&quot;chapter&quot;:15,&quot;paragraph&quot;:50,&quot;source_line&quot;:4030,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0015&quot;},&quot;15.062&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;I ate up the loaf, drank the water every drop, and laid myself down. The bed was hard, the covering thin and scanty, and the night cold: I dreamed that I lay in the chamber of death, between the warrior and the lady with the healing wound.&quot;,&quot;id&quot;:&quot;15.062&quot;,&quot;chapter&quot;:15,&quot;paragraph&quot;:62,&quot;source_line&quot;:4093,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0015&quot;},&quot;15.068&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;When I went down in the morning, I found bread and water waiting me, the loaf so large that I ate only half of it. My hostess sat muffled beside me while I broke my fast, and except to greet me when I entered, never opened her mouth until I asked her to instruct me how to arrive at Bulika. She then told me to go up the bank of the river-bed until it disappeared; then verge to the right until I came to a forest—in which I might spend a night, but which I must leave with my face to the rising moon. Keeping in the same direction, she said, until I reached a running stream, I must cross that at right angles, and go straight on until I saw the city on the horizon.&quot;,&quot;id&quot;:&quot;15.068&quot;,&quot;chapter&quot;:15,&quot;paragraph&quot;:68,&quot;source_line&quot;:4133,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0015&quot;},&quot;15.085&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;“May I take what is left of the loaf?” I asked presently.&quot;,&quot;id&quot;:&quot;15.085&quot;,&quot;chapter&quot;:15,&quot;paragraph&quot;:85,&quot;source_line&quot;:4201,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0015&quot;},&quot;16.001&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;I rose to resume my journey, and walked many a desert mile. How I longed for a mountain, or even a tall rock, from whose summit I might see across the dismal plain or the dried-up channels to some bordering hope! Yet what could such foresight have availed me? That which is within a man, not that which lies beyond his vision, is the main factor in what is about to befall him: the operation upon him is the event. Foreseeing is not understanding, else surely the prophecy latent in man would come oftener to the surface!&quot;,&quot;id&quot;:&quot;16.001&quot;,&quot;chapter&quot;:16,&quot;paragraph&quot;:1,&quot;source_line&quot;:4280,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0016&quot;},&quot;16.003&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;As I lay listening, my eyes went wandering up and down the rocky slope abrupt above me, reading on its face the record that down there, ages ago, rushed a cataract, filling the channels that had led me to its foot. My heart swelled at the thought of the splendid tumult, where the waves danced revelling in helpless fall, to mass their music in one organ-roar below. But soon the hidden brooks lulled me to sleep, and their lullabies mingled with my dreams.&quot;,&quot;id&quot;:&quot;16.003&quot;,&quot;chapter&quot;:16,&quot;paragraph&quot;:3,&quot;source_line&quot;:4303,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0016&quot;},&quot;16.004&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;I woke before the sun, and eagerly climbed to see what lay beyond. Alas, nothing but a desert of finest sand! Not a trace was left of the river that had plunged adown the rocks! The powdery drift had filled its course to the level of the dreary expanse! As I looked back I saw that the river had divided into two branches as it fell, that whose bank I had now followed to the foot of the rocky scaur, and that which first I crossed to the Evil Wood. The wood I descried between the two on the far horizon. Before me and to the left, the desert stretched beyond my vision, but far to the right I could see a lift in the sky-line, giving hope of the forest to which my hostess had directed me.&quot;,&quot;id&quot;:&quot;16.004&quot;,&quot;chapter&quot;:16,&quot;paragraph&quot;:4,&quot;source_line&quot;:4312,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0016&quot;},&quot;16.005&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;I sat down, and sought in my pocket the half-loaf I had brought with me—then first to understand what my hostess had meant concerning it. Verily the bread was not for the morrow: it had shrunk and hardened to a stone! I threw it away, and set out again.&quot;,&quot;id&quot;:&quot;16.005&quot;,&quot;chapter&quot;:16,&quot;paragraph&quot;:5,&quot;source_line&quot;:4324,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0016&quot;},&quot;16.006&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;About noon I came to a few tamarisk and juniper trees, and then to a few stunted firs. As I went on, closer thickets and larger firs met me, and at length I was in just such a forest of pines and other trees as that in which the Little Ones found their babies, and believed I had returned upon a farther portion of the same. But what mattered WHERE while EVERYWHERE was the same as NOWHERE! I had not yet, by doing something in it, made ANYWHERE into a place! I was not yet alive; I was only dreaming I lived! I was but a consciousness with an outlook! Truly I had been nothing else in the world I had left, but now I knew the fact! I said to myself that if in this forest I should catch the faint gleam of the mirror, I would turn far aside lest it should entrap me unawares, and give me back to my old existence: here I might learn to be something by doing something! I could not endure the thought of going back, with so many beginnings and not an end achieved. The Little Ones would meet what fate was appointed them; the awful witch I should never meet; the dead would ripen and arise without me; I should but wake to know that I had dreamed, and that all my going was nowhither! I would rather go on and on than come to such a close!&quot;,&quot;id&quot;:&quot;16.006&quot;,&quot;chapter&quot;:16,&quot;paragraph&quot;:6,&quot;source_line&quot;:4330,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0016&quot;},&quot;16.010&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;The wood thinned yet more, and the pines grew yet larger, sending up huge stems, like columns eager to support the heavens. More trees of other kinds appeared; the forest was growing richer! The roses were now trees, and their flowers of astonishing splendour.&quot;,&quot;id&quot;:&quot;16.010&quot;,&quot;chapter&quot;:16,&quot;paragraph&quot;:10,&quot;source_line&quot;:4388,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0016&quot;},&quot;16.011&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;Suddenly I spied what seemed a great house or castle; but its forms were so strangely indistinct, that I could not be certain it was more than a chance combination of tree-shapes. As I drew nearer, its lines yet held together, but neither they nor the body of it grew at all more definite; and when at length I stood in front of it, I remained as doubtful of its nature as before. House or castle habitable, it certainly was not; it might be a ruin overgrown with ivy and roses! Yet of building hid in the foliage, not the poorest wall-remnant could I discern. Again and again I seemed to descry what must be building, but it always vanished before closer inspection. Could it be, I pondered, that the ivy had embraced a huge edifice and consumed it, and its interlaced branches retained the shapes of the walls it had assimilated?—I could be sure of nothing concerning the appearance.&quot;,&quot;id&quot;:&quot;16.011&quot;,&quot;chapter&quot;:16,&quot;paragraph&quot;:11,&quot;source_line&quot;:4394,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0016&quot;},&quot;16.024&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;She had seen the change in the dead stare; she looked down; she understood the talking eyes; she pressed both her lovely hands on the shadow, gave a smothered cry, and fled. The birds moved rustling in their nests, and a flash of joy lit up the eyes of the dancers, when suddenly a warm wind, growing in strength as it swept through the place, blew out every light. But the low moon yet glimmered on the horizon with “sick assay” to shine, and a turbid radiance yet gleamed from so many eyes, that I saw well enough what followed. As if each shape had been but a snow-image, it began to fall to pieces, ruining in the warm wind. In papery flakes the flesh peeled from its bones, dropping like soiled snow from under its garments; these fell fluttering in rags and strips, and the whole white skeleton, emerging from garment and flesh together, stood bare and lank amid the decay that littered the floor. A faint rattling shiver went through the naked company; pair after pair the lamping eyes went out; and the darkness grew round me with the loneliness. For a moment the leaves were still swept fluttering all one way; then the wind ceased, and the owl floated silent through the silent night.&quot;,&quot;id&quot;:&quot;16.024&quot;,&quot;chapter&quot;:16,&quot;paragraph&quot;:24,&quot;source_line&quot;:4540,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0016&quot;},&quot;16.025&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;Not for a moment had I been afraid. It is true that whoever would cross the threshold of any world, must leave fear behind him; but, for myself, I could claim no part in its absence. No conscious courage was operant in me; simply, I was not afraid. I neither knew why I was not afraid, nor wherefore I might have been afraid. I feared not even fear—which of all dangers is the most dangerous.&quot;,&quot;id&quot;:&quot;16.025&quot;,&quot;chapter&quot;:16,&quot;paragraph&quot;:25,&quot;source_line&quot;:4559,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0016&quot;},&quot;17.001&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;I had not gone ten paces when I caught sight of a strange-looking object, and went nearer to know what it might be. I found it a mouldering carriage of ancient form, ruinous but still upright on its heavy wheels. On each side of the pole, still in its place, lay the skeleton of a horse; from their two grim white heads ascended the shrivelled reins to the hand of the skeleton-coachman seated on his tattered hammer-cloth; both doors had fallen away; within sat two skeletons, each leaning back in its corner.&quot;,&quot;id&quot;:&quot;17.001&quot;,&quot;chapter&quot;:17,&quot;paragraph&quot;:1,&quot;source_line&quot;:4581,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0017&quot;},&quot;17.060&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;She came back, and knelt once more at his side—first, however, laying the stick in dispute beyond his reach and within her own.&quot;,&quot;id&quot;:&quot;17.060&quot;,&quot;chapter&quot;:17,&quot;paragraph&quot;:60,&quot;source_line&quot;:4836,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0017&quot;},&quot;18.001&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;I went walking on, still facing the moon, who, not yet high, was staring straight into the forest. I did not know what ailed her, but she was dark and dented, like a battered disc of old copper, and looked dispirited and weary. Not a cloud was nigh to keep her company, and the stars were too bright for her. “Is this going to last for ever?” she seemed to say. She was going one way and I was going the other, yet through the wood we went a long way together. We did not commune much, for my eyes were on the ground; but her disconsolate look was fixed on me: I felt without seeing it. A long time we were together, I and the moon, walking side by side, she the dull shine, and I the live shadow.&quot;,&quot;id&quot;:&quot;18.001&quot;,&quot;chapter&quot;:18,&quot;paragraph&quot;:1,&quot;source_line&quot;:5026,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0018&quot;},&quot;18.003&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;It was the body of a tall, probably graceful woman.—How had she come there? Not of herself, and already in such wasted condition, surely! Her strength must have failed her; she had fallen, and lain there until she died of hunger! But how, even so, could she be thus emaciated? And how came she to be naked? Where were the savages to strip and leave her? or what wild beasts would have taken her garments? That her body should have been left was not wonderful!&quot;,&quot;id&quot;:&quot;18.003&quot;,&quot;chapter&quot;:18,&quot;paragraph&quot;:3,&quot;source_line&quot;:5057,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0018&quot;},&quot;18.008&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;To do for her all I could, I spread a thick layer of pine-needles and dry leaves, laid one of my garments over it, warm from my body, lifted her upon it, and covered her with my clothes and a great heap of leaves: I would save the little warmth left in her, hoping an increase to it when the sun came back. Then I tried another grape, but could perceive no slightest movement of mouth or throat.&quot;,&quot;id&quot;:&quot;18.008&quot;,&quot;chapter&quot;:18,&quot;paragraph&quot;:8,&quot;source_line&quot;:5099,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0018&quot;},&quot;18.010&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;I crept into the heap of leaves, got as close to her as I could, and took her in my arms. I had not much heat left in me, but what I had I would share with her! Thus I spent what remained of the night, sleepless, and longing for the sun. Her cold seemed to radiate into me, but no heat to pass from me to her.&quot;,&quot;id&quot;:&quot;18.010&quot;,&quot;chapter&quot;:18,&quot;paragraph&quot;:10,&quot;source_line&quot;:5112,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0018&quot;},&quot;18.017&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;But the sun was shining on her face! I re-arranged the handkerchief, laid a few leaves lightly over it, and set out to follow the creatures. Their main track was well beaten, and must have long been used—likewise many of the tracks that, joining it from both sides, merged in, and broadened it. The trees retreated as I went, and the grass grew thicker. Presently the forest was gone, and a wide expanse of loveliest green stretched away to the horizon. Through it, along the edge of the forest, flowed a small river, and to this the track led. At sight of the water a new though undefined hope sprang up in me. The stream looked everywhere deep, and was full to the brim, but nowhere more than a few yards wide. A bluish mist rose from it, vanishing as it rose. On the opposite side, in the plentiful grass, many small animals were feeding. Apparently they slept in the forest, and in the morning sought the plain, swimming the river to reach it. I knelt and would have drunk, but the water was hot, and had a strange metallic taste.&quot;,&quot;id&quot;:&quot;18.017&quot;,&quot;chapter&quot;:18,&quot;paragraph&quot;:17,&quot;source_line&quot;:5168,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0018&quot;},&quot;18.018&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;I leapt to my feet: here was the warmth I sought—the first necessity of life! I sped back to my helpless charge.&quot;,&quot;id&quot;:&quot;18.018&quot;,&quot;chapter&quot;:18,&quot;paragraph&quot;:18,&quot;source_line&quot;:5185,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0018&quot;},&quot;18.020&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;I bore her to the stream. Tall as she was, I found her marvellously light, her bones were so delicate, and so little covered them. I grew yet more hopeful when I found her so far from stiff that I could carry her on one arm, like a sleeping child, leaning against my shoulder. I went softly, dreading even the wind of my motion, and glad there was no other.&quot;,&quot;id&quot;:&quot;18.020&quot;,&quot;chapter&quot;:18,&quot;paragraph&quot;:20,&quot;source_line&quot;:5197,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0018&quot;},&quot;18.025&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;I could now leave it and go to explore, in the hope of discovering some shelter. I ran up the stream toward some rocky hills I saw in that direction, which were not far off.&quot;,&quot;id&quot;:&quot;18.025&quot;,&quot;chapter&quot;:18,&quot;paragraph&quot;:25,&quot;source_line&quot;:5234,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0018&quot;},&quot;18.033&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;I too ate of the grapes and other berries I found in the forest; but I believed that, with my daily bath in that river, I could have done very well without eating at all.&quot;,&quot;id&quot;:&quot;18.033&quot;,&quot;chapter&quot;:18,&quot;paragraph&quot;:33,&quot;source_line&quot;:5299,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0018&quot;},&quot;19.001&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;I woke one morning from a profound sleep, with one of my hands very painful. The back of it was much swollen, and in the centre of the swelling was a triangular wound, like the bite of a leech. As the day went on, the swelling subsided, and by the evening the hurt was all but healed. I searched the cave, turning over every stone of any size, but discovered nothing I could imagine capable of injuring me.&quot;,&quot;id&quot;:&quot;19.001&quot;,&quot;chapter&quot;:19,&quot;paragraph&quot;:1,&quot;source_line&quot;:5354,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0019&quot;},&quot;19.027&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;When I came to myself the sun was up. The lady stood a little way off, looking, even in the clumsy attire I had fashioned for her, at once grand and graceful. I HAD seen those glorious eyes! Through the night they had shone! Dark as the darkness primeval, they now outshone the day! She stood erect as a column, regarding me. Her pale cheek indicated no emotion, only question. I rose.&quot;,&quot;id&quot;:&quot;19.027&quot;,&quot;chapter&quot;:19,&quot;paragraph&quot;:27,&quot;source_line&quot;:5507,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0019&quot;},&quot;20.001&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;I rose, and looked around me, dazed at heart. For a moment I could not see her: she was gone, and loneliness had returned like the cloud after the rain! She whom I brought back from the brink of the grave, had fled from me, and left me with desolation! I dared not one moment remain thus hideously alone. Had I indeed done her a wrong? I must devote my life to sharing the burden I had compelled her to resume!&quot;,&quot;id&quot;:&quot;20.001&quot;,&quot;chapter&quot;:20,&quot;paragraph&quot;:1,&quot;source_line&quot;:5684,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0020&quot;},&quot;20.018&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;The whole day I followed her. The sun climbed the sky, seemed to pause on its summit, went down the other side. Not a moment did she pause, not a moment did I cease to follow. She never turned her head, never relaxed her pace.&quot;,&quot;id&quot;:&quot;20.018&quot;,&quot;chapter&quot;:20,&quot;paragraph&quot;:18,&quot;source_line&quot;:5773,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0020&quot;},&quot;21.001&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;As I hastened along, a cloud came over the moon, and from the gray dark suddenly emerged a white figure, clasping a child to her bosom, and stooping as she ran. She was on a line parallel with my own, but did not perceive me as she hurried along, terror and anxiety in every movement of her driven speed.&quot;,&quot;id&quot;:&quot;21.001&quot;,&quot;chapter&quot;:21,&quot;paragraph&quot;:1,&quot;source_line&quot;:5901,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0021&quot;},&quot;21.005&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;In a minute or two I spied a low white shape approaching me through the vapour-dusted moonlight. It must be another beast, I thought at first, for it came slowly, almost crawling, with strange, floundering leaps, as of a creature in agony! I drew aside from its path, and waited. As it neared me, I saw it was going on three legs, carrying its left fore-paw high from the ground. It had many dark, oval spots on a shining white skin, and was attended by a low rushing sound, as of water falling upon grass. As it went by me, I saw something streaming from the lifted paw.&quot;,&quot;id&quot;:&quot;21.005&quot;,&quot;chapter&quot;:21,&quot;paragraph&quot;:5,&quot;source_line&quot;:5925,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0021&quot;},&quot;21.020&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;“My voice was gone; I could not have shrieked to save my baby! When I saw the horrid mouth at my darling’s little white neck, I caught up a stone and mashed her lame foot.”&quot;,&quot;id&quot;:&quot;21.020&quot;,&quot;chapter&quot;:21,&quot;paragraph&quot;:20,&quot;source_line&quot;:5993,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0021&quot;},&quot;22.001&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;I had lost all notion of my position, and was walking about in pure, helpless impatience, when suddenly I found myself in the path of the leopardess, wading in the blood from her paw. It ran against my ankles with the force of a small brook, and I got out of it the more quickly because of an unshaped suspicion in my mind as to whose blood it might be. But I kept close to the sound of it, walking up the side of the stream, for it would guide me in the direction of Bulika.&quot;,&quot;id&quot;:&quot;22.001&quot;,&quot;chapter&quot;:22,&quot;paragraph&quot;:1,&quot;source_line&quot;:6098,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0022&quot;},&quot;22.003&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;It was gone. I had indeed for a long time noted its sound growing fainter, but at last had ceased to attend to it. I looked back: the grass in its course lay bent as it had flowed, and here and there glimmered a small pool. Toward the city, there was no trace of it. Near where I stood, the flow of its fountain must at least have paused!&quot;,&quot;id&quot;:&quot;22.003&quot;,&quot;chapter&quot;:22,&quot;paragraph&quot;:3,&quot;source_line&quot;:6124,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0022&quot;},&quot;22.004&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;Around the city were gardens, growing many sorts of vegetables, hardly one of which I recognised. I saw no water, no flowers, no sign of animals. The gardens came very near the walls, but were separated from them by huge heaps of gravel and refuse thrown from the battlements.&quot;,&quot;id&quot;:&quot;22.004&quot;,&quot;chapter&quot;:22,&quot;paragraph&quot;:4,&quot;source_line&quot;:6131,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0022&quot;},&quot;22.008&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;Hearing at length a little stir in the place, I walked through the next gate, and thence along a narrow street of tall houses to a little square, where I sat down on the base of a pillar with a hideous bat-like creature atop. Ere long, several of the inhabitants came sauntering past. I spoke to one: he gave me a rude stare and ruder word, and went on.&quot;,&quot;id&quot;:&quot;22.008&quot;,&quot;chapter&quot;:22,&quot;paragraph&quot;:8,&quot;source_line&quot;:6168,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0022&quot;},&quot;22.011&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;It was night when I woke. The moon looked down on me in friendly fashion, seeming to claim with me old acquaintance. She was very bright, and the same moon, I thought, that saw me through the terrors of my first night in that strange world. A cold wind blew from the gate, bringing with it an evil odour; but it did not chill me, for the sun had plenished me with warmth. I crept again into the city. There I found the few that were still in the open air crouched in corners to escape the shivering blast.&quot;,&quot;id&quot;:&quot;22.011&quot;,&quot;chapter&quot;:22,&quot;paragraph&quot;:11,&quot;source_line&quot;:6198,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0022&quot;},&quot;23.001&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;I turned aside into an alley, and sought shelter in a small archway. In the mouth of it I stopped, and looked out at the moonlight which filled the alley. The same instant a woman came gliding in after me, turned, trembling, and looked out also. A few seconds passed; then a huge leopard, its white skin dappled with many blots, darted across the archway. The woman pressed close to me, and my heart filled with pity. I put my arm round her.&quot;,&quot;id&quot;:&quot;23.001&quot;,&quot;chapter&quot;:23,&quot;paragraph&quot;:1,&quot;source_line&quot;:6248,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0023&quot;},&quot;23.012&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;I asked her many questions. She told me the people never did anything except dig for precious stones in their cellars. They were rich, and had everything made for them in other towns.&quot;,&quot;id&quot;:&quot;23.012&quot;,&quot;chapter&quot;:23,&quot;paragraph&quot;:12,&quot;source_line&quot;:6298,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0023&quot;},&quot;23.030&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;She told me that their princess had reigned for thousands of years; that she had power over the air and the water as well as the earth—and, she believed, over the fire too; that she could do what she pleased, and was answerable to nobody.&quot;,&quot;id&quot;:&quot;23.030&quot;,&quot;chapter&quot;:23,&quot;paragraph&quot;:30,&quot;source_line&quot;:6366,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0023&quot;},&quot;23.031&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;When at length she was willing to risk the attempt, we took our way through lanes and narrow passages, and reached her door without having met a single live creature. It was in a wider street, between two tall houses, at the top of a narrow, steep stair, up which she climbed slowly, and I followed. Ere we reached the top, however, she seemed to take fright, and darted up the rest of the steps: I arrived just in time to have the door closed in my face, and stood confounded on the landing, where was about length enough, between the opposite doors of the two houses, for a man to lie down.&quot;,&quot;id&quot;:&quot;23.031&quot;,&quot;chapter&quot;:23,&quot;paragraph&quot;:31,&quot;source_line&quot;:6372,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0023&quot;},&quot;24.001&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;At the foot of the stair lay the moonlit street, and I could hear the unwholesome, inhospitable wind blowing about below. But not a breath of it entered my retreat, and I was composing myself to rest, when suddenly my eyes opened, and there was the head of the shining creature I had seen following the Shadow, just rising above the uppermost step! The moment she caught sight of my eyes, she stopped and began to retire, tail foremost. I sprang up; whereupon, having no room to turn, she threw herself backward, head over tail, scrambled to her feet, and in a moment was down the stair and gone. I followed her to the bottom, and looked all up and down the street. Not seeing her, I went back to my hard couch.&quot;,&quot;id&quot;:&quot;24.001&quot;,&quot;chapter&quot;:24,&quot;paragraph&quot;:1,&quot;source_line&quot;:6397,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0024&quot;},&quot;24.009&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;A bulky object fell with a heavy squelch in the middle of the street, a few yards from us. I ran to it, and found a pulpy mass, with just form enough left to show it the body of a woman. It must have been thrown from some neighbouring window! I looked around me: the Shadow was walking along the other side of the way, with the white leopardess again at his heel!&quot;,&quot;id&quot;:&quot;24.009&quot;,&quot;chapter&quot;:24,&quot;paragraph&quot;:9,&quot;source_line&quot;:6456,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0024&quot;},&quot;24.011&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;I turned away angry with myself: I had been losing my time ever since I entered the place! night as it was I would go straight to the palace! From the square I had seen it—high above the heart of the city, compassed with many defences, more a fortress than a palace!&quot;,&quot;id&quot;:&quot;24.011&quot;,&quot;chapter&quot;:24,&quot;paragraph&quot;:11,&quot;source_line&quot;:6473,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0024&quot;},&quot;24.017&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;I left the recess with a new hope, as strong as it was shapeless. One thing only was clear to me: I must find the princess! Surely I had some power with her, if not over her! Had I not saved her life, and had she not prolonged it at the expense of my vitality? The reflection gave me courage to encounter her, be she what she might.&quot;,&quot;id&quot;:&quot;24.017&quot;,&quot;chapter&quot;:24,&quot;paragraph&quot;:17,&quot;source_line&quot;:6518,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0024&quot;},&quot;25.001&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;Making a circuit of the castle, I came again to the open gates, crossed the ravine-like moat, and found myself in a paved court, planted at regular intervals with towering trees like poplars. In the centre was one taller than the rest, whose branches, near the top, spread a little and gave it some resemblance to a palm. Between their great stems I got glimpses of the palace, which was of a style strange to me, but suggested Indian origin. It was long and low, with lofty towers at the corners, and one huge dome in the middle, rising from the roof to half the height of the towers. The main entrance was in the centre of the front—a low arch that seemed half an ellipse. No one was visible, the doors stood wide open, and I went unchallenged into a large hall, in the form of a longish ellipse. Toward one side stood a cage, in which couched, its head on its paws, a huge leopardess, chained by a steel collar, with its mouth muzzled and its paws muffled. It was white with dark oval spots, and lay staring out of wide-open eyes, with canoe-shaped pupils, and great green irids. It appeared to watch me, but not an eyeball, not a foot, not a whisker moved, and its tail stretched out behind it rigid as an iron bar. I could not tell whether it was a live thing or not.&quot;,&quot;id&quot;:&quot;25.001&quot;,&quot;chapter&quot;:25,&quot;paragraph&quot;:1,&quot;source_line&quot;:6535,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0025&quot;},&quot;25.019&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;My heart gave a throb, as if bracing itself to the encounter. I followed him through many passages, and was at last shown into a room so large and so dark that its walls were invisible. A single spot on the floor reflected a little light, but around that spot all was black. I looked up, and saw at a great height an oval aperture in the roof, on the periphery of which appeared the joints between blocks of black marble. The light on the floor showed close fitting slabs of the same material. I found afterward that the elliptical wall as well was of black marble, absorbing the little light that reached it. The roof was the long half of an ellipsoid, and the opening in it was over one of the foci of the ellipse of the floor. I fancied I caught sight of reddish lines, but when I would have examined them, they were gone.&quot;,&quot;id&quot;:&quot;25.019&quot;,&quot;chapter&quot;:25,&quot;paragraph&quot;:19,&quot;source_line&quot;:6625,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0025&quot;},&quot;25.020&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;All at once, a radiant form stood in the centre of the darkness, flashing a splendour on every side. Over a robe of soft white, her hair streamed in a cataract, black as the marble on which it fell. Her eyes were a luminous blackness; her arms and feet like warm ivory. She greeted me with the innocent smile of a girl—and in face, figure, and motion seemed but now to have stepped over the threshold of womanhood. “Alas,” thought I, “ill did I reckon my danger! Can this be the woman I rescued—she who struck me, scorned me, left me?” I stood gazing at her out of the darkness; she stood gazing into it, as if searching for me.&quot;,&quot;id&quot;:&quot;25.020&quot;,&quot;chapter&quot;:25,&quot;paragraph&quot;:20,&quot;source_line&quot;:6639,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0025&quot;},&quot;25.032&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;“How you must miss the hot flowing river!” she said. “But there is a bath in the corner with no white leeches in it! At the foot of your couch you will find a garment. When you come down, I shall be in the room to your left at the foot of the stair.”&quot;,&quot;id&quot;:&quot;25.032&quot;,&quot;chapter&quot;:25,&quot;paragraph&quot;:32,&quot;source_line&quot;:6694,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0025&quot;},&quot;25.035&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;Clear as crystal, the water in the great white bath sent a sparkling flash from the corner where it lay sunk in the marble floor, and seemed to invite me to its embrace. Except the hot stream, two draughts in the cottage of the veiled woman, and the pools in the track of the wounded leopardess, I had not seen water since leaving home: it looked a thing celestial. I plunged in.&quot;,&quot;id&quot;:&quot;25.035&quot;,&quot;chapter&quot;:25,&quot;paragraph&quot;:35,&quot;source_line&quot;:6715,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0025&quot;},&quot;25.045&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;I drank, and wondered: every flower of Hybla and Hymettus must have sent its ghost to swell the soul of that wine!&quot;,&quot;id&quot;:&quot;25.045&quot;,&quot;chapter&quot;:25,&quot;paragraph&quot;:45,&quot;source_line&quot;:6773,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0025&quot;},&quot;25.046&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;“And now that you will be able to listen,” she went on, “I must do what I can to make myself intelligible to you. Our natures, however, are so different, that this may not be easy. Men and women live but to die; we, that is such as I—we are but a few—live to live on. Old age is to you a horror; to me it is a dear desire: the older we grow, the nearer we are to our perfection. Your perfection is a poor thing, comes soon, and lasts but a little while; ours is a ceaseless ripening. I am not yet ripe, and have lived thousands of your years—how many, I never cared to note. The everlasting will not be measured.&quot;,&quot;id&quot;:&quot;25.046&quot;,&quot;chapter&quot;:25,&quot;paragraph&quot;:46,&quot;source_line&quot;:6777,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0025&quot;},&quot;25.055&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;She rose, her eyes flashing as never human eyes flashed, and threw her arms high over her head.&quot;,&quot;id&quot;:&quot;25.055&quot;,&quot;chapter&quot;:25,&quot;paragraph&quot;:55,&quot;source_line&quot;:6851,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0025&quot;},&quot;26.003&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;When I opened my eyes, it was night. A lamp, suspended from the ceiling, cast a clear, although soft light through the chamber. A delicious languor infolded me. I seemed floating, far from land, upon the bosom of a twilight sea. Existence was in itself pleasure. I had no pain. Surely I was dying!&quot;,&quot;id&quot;:&quot;26.003&quot;,&quot;chapter&quot;:26,&quot;paragraph&quot;:3,&quot;source_line&quot;:6930,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0026&quot;},&quot;26.007&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;The princess was standing above me on the bed, looking out into the room, with the air of one who dreamed. Her great eyes were clear and calm. Her mouth wore a look of satisfied passion; she wiped from it a streak of red.&quot;,&quot;id&quot;:&quot;26.007&quot;,&quot;chapter&quot;:26,&quot;paragraph&quot;:7,&quot;source_line&quot;:6955,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0026&quot;},&quot;26.012&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;Dimly moonlighted, the cage of the leopardess was the arena of what seemed a desperate although silent struggle. Two vastly differing forms, human and bestial, with entangled confusion of mingling bodies and limbs, writhed and wrestled in closest embrace. It had lasted but an instant when I saw the leopardess out of the cage, walking quietly to the open door. As I hastened after her I threw a glance behind me: there was the leopardess in the cage, couching motionless as when I saw her first.&quot;,&quot;id&quot;:&quot;26.012&quot;,&quot;chapter&quot;:26,&quot;paragraph&quot;:12,&quot;source_line&quot;:7011,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0026&quot;},&quot;26.014&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;The Shadow took his way straight to the stair at the top of which I had lain the night before. Without a pause he went up, and the leopardess followed. I quickened my pace, but, a moment after, heard a cry of horror. Then came the fall of something soft and heavy between me and the stair, and at my feet lay a body, frightfully blackened and crushed, but still recognisable as that of the woman who had led me home and shut me out. As I stood petrified, the spotted leopardess came bounding down the stair with a baby in her mouth. I darted to seize her ere she could turn at the foot; but that instant, from behind me, the white leopardess, like a great bar of glowing silver, shot through the moonlight, and had her by the neck. She dropped the child; I caught it up, and stood to watch the battle between them.&quot;,&quot;id&quot;:&quot;26.014&quot;,&quot;chapter&quot;:26,&quot;paragraph&quot;:14,&quot;source_line&quot;:7029,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0026&quot;},&quot;27.013&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;The moon was near the zenith, and her present silver seemed brighter than the gold of the absent sun. She brought me through the trees to the tallest of them, the one in the centre. It was not quite like the rest, for its branches, drawing their ends together at the top, made a clump that looked from beneath like a fir-cone. The princess stood close under it, gazing up, and said, as if talking to herself,&quot;,&quot;id&quot;:&quot;27.013&quot;,&quot;chapter&quot;:27,&quot;paragraph&quot;:13,&quot;source_line&quot;:7153,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0027&quot;},&quot;27.018&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;I considered the tree. All the way up to the branches, were projections on the stem like the remnants on a palm of its fallen leaves.&quot;,&quot;id&quot;:&quot;27.018&quot;,&quot;chapter&quot;:27,&quot;paragraph&quot;:18,&quot;source_line&quot;:7178,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0027&quot;},&quot;27.031&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;Now in Bulika the cold after sundown was not so great as in certain other parts of the country—especially about the sexton’s cottage; yet when I had climbed a little way, I began to feel very cold, grew still colder as I ascended, and became coldest of all when I got among the branches. Then I shivered, and seemed to have lost my hands and feet.&quot;,&quot;id&quot;:&quot;27.031&quot;,&quot;chapter&quot;:27,&quot;paragraph&quot;:31,&quot;source_line&quot;:7228,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0027&quot;},&quot;28.001&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;I rubbed the water out of my eyes, and saw the raven on the edge of a huge stone basin. With the cold light of the dawn reflected from his glossy plumage, he stood calmly looking down upon me. I lay on my back in water, above which, leaning on my elbows, I just lifted my face. I was in the basin of the large fountain constructed by my father in the middle of the lawn. High over me glimmered the thick, steel-shiny stalk, shooting, with a torrent uprush, a hundred feet into the air, to spread in a blossom of foam.&quot;,&quot;id&quot;:&quot;28.001&quot;,&quot;chapter&quot;:28,&quot;paragraph&quot;:1,&quot;source_line&quot;:7261,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0028&quot;},&quot;29.010&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;“No living creature did I see!—except a disreputable-looking cat that bolted into the shrubbery.”&quot;,&quot;id&quot;:&quot;29.010&quot;,&quot;chapter&quot;:29,&quot;paragraph&quot;:10,&quot;source_line&quot;:7501,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0029&quot;},&quot;29.060&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;She flung herself on the floor, dwindled and dwindled, and was again a gray cat. Adam caught her up by the skin of her neck, bore her to the closet, and threw her in. He described a strange figure on the threshold, and closing the door, locked it.&quot;,&quot;id&quot;:&quot;29.060&quot;,&quot;chapter&quot;:29,&quot;paragraph&quot;:60,&quot;source_line&quot;:7831,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0029&quot;},&quot;30.003&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;“Every way,” he answered. “She fears, therefore hates her child, and is in this house on her way to destroy her. The birth of children is in her eyes the death of their parents, and every new generation the enemy of the last. Her daughter appears to her an open channel through which her immortality—which yet she counts self-inherent—is flowing fast away: to fill it up, almost from her birth she has pursued her with an utter enmity. But the result of her machinations hitherto is, that in the region she claims as her own, has appeared a colony of children, to which that daughter is heart and head and sheltering wings. My Eve longed after the child, and would have been to her as a mother to her first-born, but we were then unfit to train her: she was carried into the wilderness, and for ages we knew nothing of her fate. But she was divinely fostered, and had young angels for her playmates; nor did she ever know care until she found a baby in the wood, and the mother-heart in her awoke. One by one she has found many children since, and that heart is not yet full. Her family is her absorbing charge, and never children were better mothered. Her authority over them is without appeal, but it is unknown to herself, and never comes to the surface except in watchfulness and service. She has forgotten the time when she lived without them, and thinks she came herself from the wood, the first of the family.&quot;,&quot;id&quot;:&quot;30.003&quot;,&quot;chapter&quot;:30,&quot;paragraph&quot;:3,&quot;source_line&quot;:7858,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0030&quot;},&quot;30.004&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;“You have saved the life of her and their enemy; therefore your life belongs to her and them. The princess was on her way to destroy them, but as she crossed that stream, vengeance overtook her, and she would have died had you not come to her aid. You did; and ere now she would have been raging among the Little Ones, had she dared again cross the stream. But there was yet a way to the blessed little colony through the world of the three dimensions; only, from that, by the slaying of her former body, she had excluded herself, and except in personal contact with one belonging to it, could not re-enter it. You provided the opportunity: never, in all her long years, had she had one before. Her hand, with lightest touch, was on one or other of your muffled feet, every step as you climbed. In that little chamber, she is now watching to leave it as soon as ever she may.”&quot;,&quot;id&quot;:&quot;30.004&quot;,&quot;chapter&quot;:30,&quot;paragraph&quot;:4,&quot;source_line&quot;:7880,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0030&quot;},&quot;30.011&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;“The closet is no nearer our cottage, and no farther from it, than any or every other place.”&quot;,&quot;id&quot;:&quot;30.011&quot;,&quot;chapter&quot;:30,&quot;paragraph&quot;:11,&quot;source_line&quot;:7919,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0030&quot;},&quot;30.029&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;We ran, and reached the wooden chamber breathless. Mr. Raven seized the chains and adjusted the hood. Then he set the mirrors in their proper relation, and came beside me in front of the standing one. Already I saw the mountain range emerging from the mist.&quot;,&quot;id&quot;:&quot;30.029&quot;,&quot;chapter&quot;:30,&quot;paragraph&quot;:29,&quot;source_line&quot;:8015,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0030&quot;},&quot;31.045&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;Across the evil hollow we sped like a bolt from an arblast. No monster lifted its neck; all knew the hoofs that thundered over their heads! We rushed up the hills, we shot down their farther slopes; from the rocky chasms of the river-bed he did not swerve; he held on over them his fierce, terrible gallop. The moon, half-way up the heaven, gazed with a solemn trouble in her pale countenance. Rejoicing in the power of my steed and in the pride of my life, I sat like a king and rode.&quot;,&quot;id&quot;:&quot;31.045&quot;,&quot;chapter&quot;:31,&quot;paragraph&quot;:45,&quot;source_line&quot;:8297,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0031&quot;},&quot;32.004&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;All at once I missed the howling, and the caterwauling grew wilder. Then came the soft padding, and I knew it meant flight: the cats had defeated the wolves! In a moment the sharpest of sharp teeth were in my legs; a moment more and the cats were all over me in a live cataract, biting wherever they could bite, furiously scratching me anywhere and everywhere. A multitude clung to my body; I could not flee. Madly I fell on the hateful swarm, every finger instinct with destruction. I tore them off me, I throttled at them in vain: when I would have flung them from me, they clung to my hands like limpets. I trampled them under my feet, thrust my fingers in their eyes, caught them in jaws stronger than theirs, but could not rid myself of one. Without cease they kept discovering upon me space for fresh mouthfuls; they hauled at my skin with the widespread, horribly curved pincers of clutching claws; they hissed and spat in my face—but never touched it until, in my despair, I threw myself on the ground, when they forsook my body, and darted at my face. I rose, and immediately they left it, the more to occupy themselves with my legs. In an agony I broke from them and ran, careless whither, cleaving the solid dark. They accompanied me in a surrounding torrent, now rubbing, now leaping up against me, but tormenting me no more. When I fell, which was often, they gave me time to rise; when from fear of falling I slackened my pace, they flew afresh at my legs. All that miserable night they kept me running—but they drove me by a comparatively smooth path, for I tumbled into no gully, and passing the Evil Wood without seeing it, left it behind in the dark. When at length the morning appeared, I was beyond the channels, and on the verge of the orchard valley. In my joy I would have made friends with my persecutors, but not a cat was to be seen. I threw myself on the moss, and fell fast asleep.&quot;,&quot;id&quot;:&quot;32.004&quot;,&quot;chapter&quot;:32,&quot;paragraph&quot;:4,&quot;source_line&quot;:8365,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0032&quot;},&quot;32.013&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;We were travelling through the forest in which they found the babies, and which, as I had suspected, stretched all the way from the valley to the hot stream.&quot;,&quot;id&quot;:&quot;32.013&quot;,&quot;chapter&quot;:32,&quot;paragraph&quot;:13,&quot;source_line&quot;:8468,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0032&quot;},&quot;32.024&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;The sun was set, and it was fast getting dark, yet presently a multitude of birds began to sing. I lay down to listen, pretty sure that, if I left them alone, the hiders would soon come out again.&quot;,&quot;id&quot;:&quot;32.024&quot;,&quot;chapter&quot;:32,&quot;paragraph&quot;:24,&quot;source_line&quot;:8513,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0032&quot;},&quot;32.033&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;A moment after, I heard him calling out of his nest, a great way up a walnut tree of enormous size,&quot;,&quot;id&quot;:&quot;32.033&quot;,&quot;chapter&quot;:32,&quot;paragraph&quot;:33,&quot;source_line&quot;:8564,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0032&quot;},&quot;33.001&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;I lay down by a tree, and one and one or in little groups, the children left me and climbed to their nests. They were always so tired at night and so rested in the morning, that they were equally glad to go to sleep and to get up again. I, although tired also, lay awake: Lona had not bid me good night, and I was sure she would come.&quot;,&quot;id&quot;:&quot;33.001&quot;,&quot;chapter&quot;:33,&quot;paragraph&quot;:1,&quot;source_line&quot;:8584,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0033&quot;},&quot;33.019&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;It was yet far from morning when I became aware of a slight fluttering and scrambling. I rose on my elbow, and looking about me, saw many Little Ones descend from their nests. They disappeared, and in a few moments all was again still.&quot;,&quot;id&quot;:&quot;33.019&quot;,&quot;chapter&quot;:33,&quot;paragraph&quot;:19,&quot;source_line&quot;:8776,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0033&quot;},&quot;33.026&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;I woke soon after the sun, and lay pondering. Two hours passed, and then in truth the giants began to appear, in straggling companies of three and four, until I counted over a hundred of them. The children were still asleep, and to call them would draw the attention of the giants: I would keep quiet so long as they did not discover me. But by and by one came blundering upon me, stumbled, fell, and rose again. I thought he would pass heedless, but he began to search about. I sprang to my feet, and struck him in the middle of his huge body. The roar he gave roused the children, and a storm as of hail instantly came on, of which not a stone struck me, and not one missed the giant. He fell and lay. Others drew near, and the storm extended, each purblind creature becoming, as he entered the range of a garrisoned tree, a target for converging stones. In a short time almost every giant was prostrate, and a jubilant pæan of bird-song rose from the tops of fifty trees.&quot;,&quot;id&quot;:&quot;33.026&quot;,&quot;chapter&quot;:33,&quot;paragraph&quot;:26,&quot;source_line&quot;:8846,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0033&quot;},&quot;34.007&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;We began, therefore, and pushed forward our preparations, constantly reviewing the merry troops and companies. Lona gave her attention chiefly to the commissariat, while I drilled the little soldiers, exercised them in stone-throwing, taught them the use of some other weapons, and did all I could to make warriors of them. The main difficulty was to get them to rally to their flag the instant the call was sounded. Most of them were armed with slings, some of the bigger boys with bows and arrows. The bigger girls carried aloe-spikes, strong as steel and sharp as needles, fitted to longish shafts—rather formidable weapons. Their sole duty was the charge of such as were too small to fight.&quot;,&quot;id&quot;:&quot;34.007&quot;,&quot;chapter&quot;:34,&quot;paragraph&quot;:7,&quot;source_line&quot;:8931,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0034&quot;},&quot;34.013&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;The undertaking did indeed at times appear to me a foolhardy one, but the confidence of the woman of Bulika, real or simulated, always overcame my hesitancy. The princess’s magic, she insisted, would prove powerless against the children; and as to any force she might muster, our animal-allies alone would assure our superiority: she was herself, she said, ready, with a good stick, to encounter any two men of Bulika. She confessed to not a little fear of the leopardess, but I was myself ready for her. I shrank, however, from carrying ALL the children with us.&quot;,&quot;id&quot;:&quot;34.013&quot;,&quot;chapter&quot;:34,&quot;paragraph&quot;:13,&quot;source_line&quot;:9006,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0034&quot;},&quot;35.001&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;It was early in the morning when we set out, making, between the blue sky and the green grass, a gallant show on the wide plain. We would travel all the morning, and rest the afternoon; then go on at night, rest the next day, and start again in the short twilight. The latter part of our journey we would endeavour so to divide as to arrive at the city with the first of the morning, and be already inside the gates when discovered.&quot;,&quot;id&quot;:&quot;35.001&quot;,&quot;chapter&quot;:35,&quot;paragraph&quot;:1,&quot;source_line&quot;:9150,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0035&quot;},&quot;35.007&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;We rode through the sounding archway. Sure never had such a drumming of hoofs, such a padding of paws and feet been heard on its old pavement! The horses started and looked scared at the echo of their own steps; some halted a moment, some plunged wildly and wheeled about; but they were soon quieted, and went on. Some of the Little Ones shivered, and all were still as death. The three girls held closer the infants they carried. All except the bears and butterflies manifested fear.&quot;,&quot;id&quot;:&quot;35.007&quot;,&quot;chapter&quot;:35,&quot;paragraph&quot;:7,&quot;source_line&quot;:9200,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0035&quot;},&quot;35.014&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;But at the same moment we descried a white leopardess come bounding toward us down a narrow lane that led from the square to the palace. The Little Ones had not forgotten the fight of the two leopardesses in the forest: some of them looked terrified, and their ranks began to waver; but they remembered the order I had just given them, and stood fast.&quot;,&quot;id&quot;:&quot;35.014&quot;,&quot;chapter&quot;:35,&quot;paragraph&quot;:14,&quot;source_line&quot;:9266,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0035&quot;},&quot;35.016&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;As we stopped at the house to which our guides led us, we heard a scream; I sprang down, and thundered at the door. My horse came and pushed me away with his nose, turned about, and had begun to batter the door with his heels, when up came little Odu on the leopardess, and at sight of her he stood still, trembling. But she too had heard the cry, and forgetting the child on her back, threw herself at the door; the boy was dashed against it, and fell senseless. Before I could reach him, Lona had him in her arms, and as soon as he came to himself, set him on the back of his bear, which had still followed him.&quot;,&quot;id&quot;:&quot;35.016&quot;,&quot;chapter&quot;:35,&quot;paragraph&quot;:16,&quot;source_line&quot;:9284,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0035&quot;},&quot;35.019&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;Following in search of the other boy, we got int
