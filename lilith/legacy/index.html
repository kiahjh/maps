o the next house more easily, but to find, alas, that we were too late: one of the savages had just killed the little captive! It consoled Lona, however, to learn which he was, for she had been expecting him to grow a bad giant, from which worst of fates death had saved him. The leopardess sprang upon his murderer, took him by the throat, dragged him into the street, and followed Lona with him, like a cat with a great rat in her jaws.&quot;,&quot;id&quot;:&quot;35.019&quot;,&quot;chapter&quot;:35,&quot;paragraph&quot;:19,&quot;source_line&quot;:9308,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0035&quot;},&quot;36.003&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;From the top of one of its great towers, the princess had, in the early morning, while the city yet slept, descried the approach of the army of the Little Ones. The sight awoke in her an over-mastering terror: she had failed in her endeavour to destroy them, and they were upon her! The prophecy was about to be fulfilled!&quot;,&quot;id&quot;:&quot;36.003&quot;,&quot;chapter&quot;:36,&quot;paragraph&quot;:3,&quot;source_line&quot;:9373,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0036&quot;},&quot;36.008&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;In the morning we chose twelve of the tallest and bravest of the boys to go with us to the palace. We rode our great horses, and they small horses and elephants.&quot;,&quot;id&quot;:&quot;36.008&quot;,&quot;chapter&quot;:36,&quot;paragraph&quot;:8,&quot;source_line&quot;:9411,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0036&quot;},&quot;36.016&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;“Mother! mother!” cried Lona again, as she leaped on the daïs, and flung her arms around the princess.&quot;,&quot;id&quot;:&quot;36.016&quot;,&quot;chapter&quot;:36,&quot;paragraph&quot;:16,&quot;source_line&quot;:9460,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0036&quot;},&quot;36.023&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;I reached the square: the little army was gone! Its emptiness roused me. Where were the Little Ones, HER Little Ones? I had lost her children! I stared helpless about me, staggered to the pillar, and sank upon its base.&quot;,&quot;id&quot;:&quot;36.023&quot;,&quot;chapter&quot;:36,&quot;paragraph&quot;:23,&quot;source_line&quot;:9509,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0036&quot;},&quot;37.001&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;A murmur of pleasure from my companions roused me: they had caught sight of their fellows in the distance! The two on Lona’s horse rode on to join them. They were greeted with a wavering shout—which immediately died away. As we drew near, the sound of their sobs reached us like the breaking of tiny billows.&quot;,&quot;id&quot;:&quot;37.001&quot;,&quot;chapter&quot;:37,&quot;paragraph&quot;:1,&quot;source_line&quot;:9555,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0037&quot;},&quot;37.013&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;“What made you run away?” I asked. “I expected to find you where I left you!”&quot;,&quot;id&quot;:&quot;37.013&quot;,&quot;chapter&quot;:37,&quot;paragraph&quot;:13,&quot;source_line&quot;:9614,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0037&quot;},&quot;37.031&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;I fell a wondering where Lona was gone, and dropping on the grass, took the dead thing in my lap, and whispered in its ear, “Where are you, Lona? I love you!” But its lips gave no answer. I kissed them, not quite cold, laid the body down again, and appointing a guard over it, rose to provide for the safety of Lona’s people during the night.&quot;,&quot;id&quot;:&quot;37.031&quot;,&quot;chapter&quot;:37,&quot;paragraph&quot;:31,&quot;source_line&quot;:9691,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0037&quot;},&quot;38.001&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;In the morning we set out, and made for the forest as fast as we could. I rode Lona’s horse, and carried her body. I would take it to her father: he would give it a couch in the chamber of his dead! or, if he would not, seeing she had not come of herself, I would watch it in the desert until it mouldered away! But I believed he would, for surely she had died long ago! Alas, how bitterly must I not humble myself before him!&quot;,&quot;id&quot;:&quot;38.001&quot;,&quot;chapter&quot;:38,&quot;paragraph&quot;:1,&quot;source_line&quot;:9721,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0038&quot;},&quot;38.008&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;The next day we crossed the hot stream. Again on their own ground, the Little Ones were jubilant. But their nests were still at a great distance, and that day we went no farther than the ivy-hall, where, because of its grapes, I had resolved to spend the night. When they saw the great clusters, at once they knew them good, rushed upon them, ate eagerly, and in a few minutes were all fast asleep on the green floor and in the forest around the hall. Hoping again to see the dance, and expecting the Little Ones to sleep through it, I had made them leave a wide space in the middle. I lay down among them, with Lona by my side, but did not sleep.&quot;,&quot;id&quot;:&quot;38.008&quot;,&quot;chapter&quot;:38,&quot;paragraph&quot;:8,&quot;source_line&quot;:9757,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0038&quot;},&quot;38.009&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;The night came, and suddenly the company was there. I was wondering with myself whether, night after night, they would thus go on dancing to all eternity, and whether I should not one day have to join them because of my stiff-neckedness, when the eyes of the children came open, and they sprang to their feet, wide awake. Immediately every one caught hold of a dancer, and away they went, bounding and skipping. The spectres seemed to see and welcome them: perhaps they knew all about the Little Ones, for they had themselves long been on their way back to childhood! Anyhow, their innocent gambols must, I thought, bring refreshment to weary souls who, their present taken from them and their future dark, had no life save the shadow of their vanished past. Many a merry but never a rude prank did the children play; and if they did at times cause a momentary jar in the rhythm of the dance, the poor spectres, who had nothing to smile withal, at least manifested no annoyance.&quot;,&quot;id&quot;:&quot;38.009&quot;,&quot;chapter&quot;:38,&quot;paragraph&quot;:9,&quot;source_line&quot;:9768,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0038&quot;},&quot;38.011&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;The next morning, as we started, we spied, a little way from us, two skeletons moving about in a thicket. The Little Ones broke their ranks, and ran to them. I followed; and, although now walking at ease, without splint or ligature, I was able to recognise the pair I had before seen in that neighbourhood. The children at once made friends with them, laying hold of their arms, and stroking the bones of their long fingers; and it was plain the poor creatures took their attentions kindly. The two seemed on excellent terms with each other. Their common deprivation had drawn them together! the loss of everything had been the beginning of a new life to them!&quot;,&quot;id&quot;:&quot;38.011&quot;,&quot;chapter&quot;:38,&quot;paragraph&quot;:11,&quot;source_line&quot;:9796,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0038&quot;},&quot;38.014&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;The princess had eaten nothing, and her eyes remained shut: fearing she might die ere we reached the end of our journey, I went to her in the night, and laid my bare arm upon her lips. She bit into it so fiercely that I cried out. How I got away from her I do not know, but I came to myself lying beyond her reach. It was then morning, and immediately I set about our departure.&quot;,&quot;id&quot;:&quot;38.014&quot;,&quot;chapter&quot;:38,&quot;paragraph&quot;:14,&quot;source_line&quot;:9823,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0038&quot;},&quot;38.015&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;Choosing twelve Little Ones, not of the biggest and strongest, but of the sweetest and merriest, I mounted them on six elephants, and took two more of the wise CLUMSIES, as the children called them, to bear the princess. I still rode Lona’s horse, and carried her body wrapt in her cloak before me. As nearly as I could judge I took the direct way, across the left branch of the river-bed, to the House of Bitterness, where I hoped to learn how best to cross the broader and rougher branch, and how to avoid the basin of monsters: I dreaded the former for the elephants, the latter for the children.&quot;,&quot;id&quot;:&quot;38.015&quot;,&quot;chapter&quot;:38,&quot;paragraph&quot;:15,&quot;source_line&quot;:9831,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0038&quot;},&quot;38.091&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;Mara, drest and muffled in white, was indeed standing in the doorway to receive us.&quot;,&quot;id&quot;:&quot;38.091&quot;,&quot;chapter&quot;:38,&quot;paragraph&quot;:91,&quot;source_line&quot;:10111,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0038&quot;},&quot;39.006&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;As soon as Mara left the room with the children, my eyes fell on the white leopardess: I thought we had left her behind us, but there she was, cowering in a corner. Apparently she was in mortal terror of what she might see. A lamp stood on the high chimney-piece, and sometimes the room seemed full of lamp-shadows, sometimes of cloudy forms. The princess lay on the settle by the wall, and seemed never to have moved hand or foot. It was a fearsome waiting.&quot;,&quot;id&quot;:&quot;39.006&quot;,&quot;chapter&quot;:39,&quot;paragraph&quot;:6,&quot;source_line&quot;:10238,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0039&quot;},&quot;39.108&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;Like her mother, in whom lay the motherhood of all the world, Mara put her arms around Lilith, and kissed her on the forehead. The fiery-cold misery went out of her eyes, and their fountains filled. She lifted, and bore her to her own bed in a corner of the room, laid her softly upon it, and closed her eyes with caressing hands.&quot;,&quot;id&quot;:&quot;39.108&quot;,&quot;chapter&quot;:39,&quot;paragraph&quot;:108,&quot;source_line&quot;:10747,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0039&quot;},&quot;40.043&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;It was the loveliest of mornings; the sun shone his brightest, and the wind blew his sweetest, but they did not comfort the desert, for it had no water.&quot;,&quot;id&quot;:&quot;40.043&quot;,&quot;chapter&quot;:40,&quot;paragraph&quot;:43,&quot;source_line&quot;:10952,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0040&quot;},&quot;40.044&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;We crossed the channels without difficulty, the children gamboling about Mara all the way, but did not reach the top of the ridge over the bad burrow until the sun was already in the act of disappearing. Then I made the Little Ones mount their elephants, for the moon might be late, and I could not help some anxiety about them.&quot;,&quot;id&quot;:&quot;40.044&quot;,&quot;chapter&quot;:40,&quot;paragraph&quot;:44,&quot;source_line&quot;:10957,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0040&quot;},&quot;40.050&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;But the hideous forms I saw that night! Mara was a few paces in front of me when a solitary, bodiless head bounced on the path between us. The leopardess came rushing under the elephants from behind, and would have seized it, but, with frightful contortions of visage and a loathsome howl, it gave itself a rapid rotatory twist, sprang from her, and buried itself in the ground. The death in my arms assoiling me from fear, I regarded them all unmoved, although never, sure, was elsewhere beheld such a crew accursed!&quot;,&quot;id&quot;:&quot;40.050&quot;,&quot;chapter&quot;:40,&quot;paragraph&quot;:50,&quot;source_line&quot;:10996,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0040&quot;},&quot;40.059&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;“Mother,” I said, although I did not see her, “we come to you many, but most of us are Little Ones. Will you be able to receive us all?”&quot;,&quot;id&quot;:&quot;40.059&quot;,&quot;chapter&quot;:40,&quot;paragraph&quot;:59,&quot;source_line&quot;:11060,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0040&quot;},&quot;40.083&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;Eve came from the chamber of death, where she had laid Lona down, and offered of the bread and wine to the princess.&quot;,&quot;id&quot;:&quot;40.083&quot;,&quot;chapter&quot;:40,&quot;paragraph&quot;:83,&quot;source_line&quot;:11167,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0040&quot;},&quot;40.106&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;The darkness, the cold, the silence, the still air, the faces of the lovely dead, made the hearts of the children beat softly, but their little tongues would talk—with low, hushed voices.&quot;,&quot;id&quot;:&quot;40.106&quot;,&quot;chapter&quot;:40,&quot;paragraph&quot;:106,&quot;source_line&quot;:11263,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0040&quot;},&quot;40.121&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;Eve set Lilith down beside it. Adam pointed to the vacant couch on Lona’s right hand, and said,&quot;,&quot;id&quot;:&quot;40.121&quot;,&quot;chapter&quot;:40,&quot;paragraph&quot;:121,&quot;source_line&quot;:11330,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0040&quot;},&quot;40.157&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;“Will you not dress the wound?” I said.&quot;,&quot;id&quot;:&quot;40.157&quot;,&quot;chapter&quot;:40,&quot;paragraph&quot;:157,&quot;source_line&quot;:11470,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0040&quot;},&quot;41.014&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;“Let us go to the cottage,” he said to me; “there I will instruct you.”&quot;,&quot;id&quot;:&quot;41.014&quot;,&quot;chapter&quot;:41,&quot;paragraph&quot;:14,&quot;source_line&quot;:11588,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0041&quot;},&quot;41.017&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;“You will remember,” he said, “how, after leaving my daughter’s house, you came to a dry rock, bearing the marks of an ancient cataract; you climbed that rock, and found a sandy desert: go to that rock now, and from its summit walk deep into the desert. But go not many steps ere you lie down, and listen with your head on the sand. If you hear the murmur of water beneath, go a little farther, and listen again. If you still hear the sound, you are in the right direction. Every few yards you must stop, lie down, and hearken. If, listening thus, at any time you hear no sound of water, you are out of the way, and must hearken in every direction until you hear it again. Keeping with the sound, and careful not to retrace your steps, you will soon hear it louder, and the growing sound will lead you to where it is loudest: that is the spot you seek. There dig with the spade I will give you, and dig until you come to moisture: in it lay the hand, cover it to the level of the desert, and come home.—But give good heed, and carry the hand with care. Never lay it down, in what place of seeming safety soever; let nothing touch it; stop nor turn aside for any attempt to bar your way; never look behind you; speak to no one, answer no one, walk straight on.—It is yet dark, and the morning is far distant, but you must set out at once.”&quot;,&quot;id&quot;:&quot;41.017&quot;,&quot;chapter&quot;:41,&quot;paragraph&quot;:17,&quot;source_line&quot;:11599,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0041&quot;},&quot;41.022&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;A moon came, and herself showed me the easy way: toward morning I was almost over the dry channels of the first branch of the river-bed, and not far, I judged, from Mara’s cottage.&quot;,&quot;id&quot;:&quot;41.022&quot;,&quot;chapter&quot;:41,&quot;paragraph&quot;:22,&quot;source_line&quot;:11639,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0041&quot;},&quot;41.037&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;My way now led me past the door of Mara’s cottage. It stood wide open, and upon the table I saw a loaf of bread and a pitcher of water. In or around the cottage was neither howl nor wail.&quot;,&quot;id&quot;:&quot;41.037&quot;,&quot;chapter&quot;:41,&quot;paragraph&quot;:37,&quot;source_line&quot;:11725,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0041&quot;},&quot;41.038&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;I came to the precipice that testified to the vanished river. I climbed its worn face, and went on into the desert. There at last, after much listening to and fro, I determined the spot where the hidden water was loudest, hung Lilith’s hand about my neck, and began to dig. It was a long labour, for I had to make a large hole because of the looseness of the sand; but at length I threw up a damp spadeful. I flung the sexton-tool on the verge, and laid down the hand. A little water was already oozing from under its fingers. I sprang out, and made haste to fill the grave. Then, utterly fatigued, I dropped beside it, and fell asleep.&quot;,&quot;id&quot;:&quot;41.038&quot;,&quot;chapter&quot;:41,&quot;paragraph&quot;:38,&quot;source_line&quot;:11730,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0041&quot;},&quot;42.001&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;When I woke, the ground was moist about me, and my track to the grave was growing a quicksand. In its ancient course the river was swelling, and had begun to shove at its burden. Soon it would be roaring down the precipice, and, divided in its fall, rushing with one branch to resubmerge the orchard valley, with the other to drown perhaps the monster horde, and between them to isle the Evil Wood. I set out at once on my return to those who sent me.&quot;,&quot;id&quot;:&quot;42.001&quot;,&quot;chapter&quot;:42,&quot;paragraph&quot;:1,&quot;source_line&quot;:11751,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0042&quot;},&quot;42.016&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;The sun was down, and the moon unrisen, when I reached the abode of the monsters, but it was still as a stone till I passed over. Then I heard a noise of many waters, and a great cry behind me, but I did not turn my head.&quot;,&quot;id&quot;:&quot;42.016&quot;,&quot;chapter&quot;:42,&quot;paragraph&quot;:16,&quot;source_line&quot;:11827,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0042&quot;},&quot;42.021&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;I dropped Adam’s old spade, and the dull sound of its fall on the clay floor seemed reverberated from the chamber beyond: a childish terror seized me; I sat and stared at the coffin-door.—But father Adam, mother Eve, sister Mara would soon come to me, and then—welcome the cold world and the white neighbours! I forgot my fears, lived a little, and loved my dead.&quot;,&quot;id&quot;:&quot;42.021&quot;,&quot;chapter&quot;:42,&quot;paragraph&quot;:21,&quot;source_line&quot;:11856,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0042&quot;},&quot;42.068&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;“I have told you that years are of no consequence in this house,” answered Adam; “we do not heed them. Your father will wake when his morning comes. Your mother, next to whom you are lying,——”&quot;,&quot;id&quot;:&quot;42.068&quot;,&quot;chapter&quot;:42,&quot;paragraph&quot;:68,&quot;source_line&quot;:12049,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0042&quot;},&quot;43.009&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;I walked round the border of the little mere, and climbed the range of hills. What a sight rose to my eyes! The whole expanse where, with hot, aching feet, I had crossed and recrossed the deep-scored channels and ravines of the dry river-bed, was alive with streams, with torrents, with still pools—“a river deep and wide”! How the moon flashed on the water! how the water answered the moon with flashes of its own—white flashes breaking everywhere from its rock-encountered flow! And a great jubilant song arose from its bosom, the song of new-born liberty. I stood a moment gazing, and my heart also began to exult: my life was not all a failure! I had helped to set this river free!—My dead were not lost! I had but to go after and find them! I would follow and follow until I came whither they had gone! Our meeting might be thousands of years away, but at last—AT LAST I should hold them! Wherefore else did the floods clap their hands?&quot;,&quot;id&quot;:&quot;43.009&quot;,&quot;chapter&quot;:43,&quot;paragraph&quot;:9,&quot;source_line&quot;:12214,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0043&quot;},&quot;44.054&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;Then each turned and looked at the sleeping bedfellow, gazed a moment with loving eyes, kissed the silent companion of the night, and sprang from the couch. The Little Ones who had lain down beside my father and mother gazed blank and sad for a moment at their empty places, then slid slowly to the floor. There they fell each into the other’s arms, as if then first, each by the other’s eyes, assured they were alive and awake. Suddenly spying Lona, they came running, radiant with bliss, to embrace her. Odu, catching sight of the leopardess on the feet of the princess, bounded to her next, and throwing an arm over the great sleeping head, fondled and kissed it.&quot;,&quot;id&quot;:&quot;44.054&quot;,&quot;chapter&quot;:44,&quot;paragraph&quot;:54,&quot;source_line&quot;:12687,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0044&quot;},&quot;44.075&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;We followed Eve to the cottage. There she offered us neither bread nor wine, but stood radiantly desiring our departure. So, with never a word of farewell, we went out. The horse and the elephants were at the door, waiting for us. We were too happy to mount them, and they followed us.&quot;,&quot;id&quot;:&quot;44.075&quot;,&quot;chapter&quot;:44,&quot;paragraph&quot;:75,&quot;source_line&quot;:12771,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0044&quot;},&quot;45.001&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;It had ceased to be dark; we walked in a dim twilight, breathing through the dimness the breath of the spring. A wondrous change had passed upon the world—or was it not rather that a change more marvellous had taken place in us? Without light enough in the sky or the air to reveal anything, every heather-bush, every small shrub, every blade of grass was perfectly visible—either by light that went out from it, as fire from the bush Moses saw in the desert, or by light that went out of our eyes. Nothing cast a shadow; all things interchanged a little light. Every growing thing showed me, by its shape and colour, its indwelling idea—the informing thought, that is, which was its being, and sent it out. My bare feet seemed to love every plant they trod upon. The world and my being, its life and mine, were one. The microcosm and macrocosm were at length atoned, at length in harmony! I lived in everything; everything entered and lived in me. To be aware of a thing, was to know its life at once and mine, to know whence we came, and where we were at home—was to know that we are all what we are, because Another is what he is! Sense after sense, hitherto asleep, awoke in me—sense after sense indescribable, because no correspondent words, no likenesses or imaginations exist, wherewithal to describe them. Full indeed—yet ever expanding, ever making room to receive—was the conscious being where things kept entering by so many open doors! When a little breeze brushing a bush of heather set its purple bells a ringing, I was myself in the joy of the bells, myself in the joy of the breeze to which responded their sweet TIN-TINNING**, myself in the joy of the sense, and of the soul that received all the joys together. To everything glad I lent the hall of my being wherein to revel. I was a peaceful ocean upon which the ground-swell of a living joy was continually lifting new waves; yet was the joy ever the same joy, the eternal joy, with tens of thousands of changing forms. Life was a cosmic holiday.&quot;,&quot;id&quot;:&quot;45.001&quot;,&quot;chapter&quot;:45,&quot;paragraph&quot;:1,&quot;source_line&quot;:12787,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0045&quot;},&quot;45.004&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;We came to the fearful hollow where once had wallowed the monsters of the earth: it was indeed, as I had beheld it in my dream, a lovely lake. I gazed into its pellucid depths. A whirlpool had swept out the soil in which the abortions burrowed, and at the bottom lay visible the whole horrid brood: a dim greenish light pervaded the crystalline water, and revealed every hideous form beneath it. Coiled in spires, folded in layers, knotted on themselves, or “extended long and large,” they weltered in motionless heaps—shapes more fantastic in ghoulish, blasting dismay, than ever wine-sodden brain of exhausted poet fevered into misbeing. He who dived in the swirling Maelstrom saw none to compare with them in horror: tentacular convolutions, tumid bulges, glaring orbs of sepian deformity, would have looked to him innocence beside such incarnations of hatefulness—every head the wicked flower that, bursting from an abominable stalk, perfected its evil significance.&quot;,&quot;id&quot;:&quot;45.004&quot;,&quot;chapter&quot;:45,&quot;paragraph&quot;:4,&quot;source_line&quot;:12830,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0045&quot;},&quot;45.008&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;The children went gamboling before, and the beasts came after us. Fluttering butterflies, darting dragon-flies hovered or shot hither and thither about our heads, a cloud of colours and flashes, now descending upon us like a snow-storm of rainbow flakes, now rising into the humid air like a rolling vapour of embodied odours. It was a summer-day more like itself, that is, more ideal, than ever man that had not died found summer-day in any world. I walked on the new earth, under the new heaven, and found them the same as the old, save that now they opened their minds to me, and I saw into them. Now, the soul of everything I met came out to greet me and make friends with me, telling me we came from the same, and meant the same. I was going to him, they said, with whom they always were, and whom they always meant; they were, they said, lightnings that took shape as they flashed from him to his. The dark rocks drank like sponges the rays that showered upon them; the great world soaked up the light, and sent out the living. Two joy-fires were Lona and I. Earth breathed heavenward her sweet-savoured smoke; we breathed homeward our longing desires. For thanksgiving, our very consciousness was that.&quot;,&quot;id&quot;:&quot;45.008&quot;,&quot;chapter&quot;:45,&quot;paragraph&quot;:8,&quot;source_line&quot;:12873,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0045&quot;},&quot;45.010&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;We did not cross it, but “walked in glory and in joy” up its right bank, until we reached the great cataract at the foot of the sandy desert, where, roaring and swirling and dropping sheer, the river divided into its two branches. There we climbed the height—and found no desert: through grassy plains, between grassy banks, flowed the deep, wide, silent river full to the brim. Then first to the Little Ones was revealed the glory of God in the limpid flow of water. Instinctively they plunged and swam, and the beasts followed them.&quot;,&quot;id&quot;:&quot;45.010&quot;,&quot;chapter&quot;:45,&quot;paragraph&quot;:10,&quot;source_line&quot;:12898,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0045&quot;},&quot;45.011&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;The desert rejoiced and blossomed as the rose. Wide forests had sprung up, their whole undergrowth flowering shrubs peopled with song-birds. Every thicket gave birth to a rivulet, and every rivulet to its water-song.&quot;,&quot;id&quot;:&quot;45.011&quot;,&quot;chapter&quot;:45,&quot;paragraph&quot;:11,&quot;source_line&quot;:12908,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0045&quot;},&quot;45.013&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;We came at length to a forest whose trees were greater, grander, and more beautiful than any we had yet seen. Their live pillars upheaved a thick embowed roof, betwixt whose leaves and blossoms hardly a sunbeam filtered. Into the rafters of this aerial vault the children climbed, and through them went scrambling and leaping in a land of bloom, shouting to the unseen elephants below, and hearing them trumpet their replies. The conversations between them Lona understood while I but guessed at them blunderingly. The Little Ones chased the squirrels, and the squirrels, frolicking, drew them on—always at length allowing themselves to be caught and petted. Often would some bird, lovely in plumage and form, light upon one of them, sing a song of what was coming, and fly away. Not one monkey of any sort could they see.&quot;,&quot;id&quot;:&quot;45.013&quot;,&quot;chapter&quot;:45,&quot;paragraph&quot;:13,&quot;source_line&quot;:12920,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0045&quot;},&quot;46.001&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;Lona and I, who walked below, heard at last a great shout overhead, and in a moment or two the Little Ones began to come dropping down from the foliage with the news that, climbing to the top of a tree yet taller than the rest, they had descried, far across the plain, a curious something on the side of a solitary mountain—which mountain, they said, rose and rose, until the sky gathered thick to keep it down, and knocked its top off.&quot;,&quot;id&quot;:&quot;46.001&quot;,&quot;chapter&quot;:46,&quot;paragraph&quot;:1,&quot;source_line&quot;:12944,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0046&quot;},&quot;46.005&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;By and by we could from the plain see the city among the blue clouds. But other clouds were gathering around a lofty tower—or was it a rock?—that stood above the city, nearer the crest of the mountain. Gray, and dark gray, and purple, they writhed in confused, contrariant motions, and tossed up a vaporous foam, while spots in them gyrated like whirlpools. At length issued a dazzling flash, which seemed for a moment to play about the Little Ones in front of us. Blinding darkness followed, but through it we heard their voices, low with delight.&quot;,&quot;id&quot;:&quot;46.005&quot;,&quot;chapter&quot;:46,&quot;paragraph&quot;:5,&quot;source_line&quot;:12968,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0046&quot;},&quot;46.021&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;Thunder, clap or roll, there had been none. And now came a sweet rain, filling the atmosphere with a caressing coolness. We breathed deep, and stepped out with stronger strides. The falling drops flashed the colours of all the waked up gems of the earth, and a mighty rainbow spanned the city.&quot;,&quot;id&quot;:&quot;46.021&quot;,&quot;chapter&quot;:46,&quot;paragraph&quot;:21,&quot;source_line&quot;:13036,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0046&quot;},&quot;46.025&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;Outside, on the landing, sat the portress, a woman-angel of dark visage, leaning her shadowed brow on her idle hand. The children rushed upon her, covering her with caresses, and ere she understood, they had taken heaven by surprise, and were already in the city, still mounting the stair by the side of the descending torrent. A great angel, attended by a company of shining ones, came down to meet and receive them, but merrily evading them all, up still they ran. In merry dance, however, a group of woman-angels descended upon them, and in a moment they were fettered in heavenly arms. The radiants carried them away, and I saw them no more.&quot;,&quot;id&quot;:&quot;46.025&quot;,&quot;chapter&quot;:46,&quot;paragraph&quot;:25,&quot;source_line&quot;:13066,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0046&quot;},&quot;46.032&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;We stood for a moment at the gate whence issued roaring the radiant river. I know not whence came the stones that fashioned it, but among them I saw the prototypes of all the gems I had loved on earth—far more beautiful than they, for these were living stones—such in which I saw, not the intent alone, but the intender too; not the idea alone, but the imbodier present, the operant outsender: nothing in this kingdom was dead; nothing was mere; nothing only a thing.&quot;,&quot;id&quot;:&quot;46.032&quot;,&quot;chapter&quot;:46,&quot;paragraph&quot;:32,&quot;source_line&quot;:13102,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0046&quot;},&quot;46.033&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;We went up through the city and passed out. There was no wall on the upper side, but a huge pile of broken rocks, upsloping like the moraine of an eternal glacier; and through the openings between the rocks, the river came billowing out. On their top I could dimly discern what seemed three or four great steps of a stair, disappearing in a cloud white as snow; and above the steps I saw, but with my mind’s eye only, as it were a grand old chair, the throne of the Ancient of Days. Over and under and between those steps issued, plenteously, unceasingly new-born, the river of the water of life.&quot;,&quot;id&quot;:&quot;46.033&quot;,&quot;chapter&quot;:46,&quot;paragraph&quot;:33,&quot;source_line&quot;:13111,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0046&quot;},&quot;46.035&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;My heart beating with hope and desire, I held faster the hand of my Lona, and we began to climb; but soon we let each other go, to use hands as well as feet in the toilsome ascent of the huge stones. At length we drew near the cloud, which hung down the steps like the borders of a garment, passed through the fringe, and entered the deep folds. A hand, warm and strong, laid hold of mine, and drew me to a little door with a golden lock. The door opened; the hand let mine go, and pushed me gently through. I turned quickly, and saw the board of a large book in the act of closing behind me. I stood alone in my library.&quot;,&quot;id&quot;:&quot;46.035&quot;,&quot;chapter&quot;:46,&quot;paragraph&quot;:35,&quot;source_line&quot;:13126,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0046&quot;},&quot;47.001&quot;:{&quot;kind&quot;:&quot;p&quot;,&quot;text&quot;:&quot;As yet I have not found Lona, but Mara is much with me. She has taught me many things, and is teaching me more.&quot;,&quot;id&quot;:&quot;47.001&quot;,&quot;chapter&quot;:47,&quot;paragraph&quot;:1,&quot;source_line&quot;:13147,&quot;source_url&quot;:&quot;https://www.gutenberg.org/files/1640/1640-h/1640-h.htm#link2HCH0047&quot;}},&quot;shortNames&quot;:{&quot;estate&quot;:&quot;Vane’s house&quot;,&quot;entry-heath&quot;:&quot;Entry heath&quot;,&quot;pine-portal&quot;:&quot;Pine crossing&quot;,&quot;sleep&quot;:&quot;House of Sleep&quot;,&quot;cemetery&quot;:&quot;Cemetery moor&quot;,&quot;bad-burrow&quot;:&quot;Bad Burrow&quot;,&quot;low-hills&quot;:&quot;Low hills&quot;,&quot;first-branch&quot;:&quot;First branch&quot;,&quot;evil-wood&quot;:&quot;Evil Wood&quot;,&quot;second-branch&quot;:&quot;Second branch&quot;,&quot;orchard&quot;:&quot;Fruit valley&quot;,&quot;bags&quot;:&quot;Bags’ old huts&quot;,&quot;nests&quot;:&quot;Nest village&quot;,&quot;baby-forest&quot;:&quot;Baby-finding forest&quot;,&quot;mara&quot;:&quot;Mara’s cottage&quot;,&quot;mara-approach&quot;:&quot;Sandy ravines&quot;,&quot;cataract&quot;:&quot;Ancient cataract&quot;,&quot;hand-site&quot;:&quot;Hand-burial site&quot;,&quot;guide-forest&quot;:&quot;Guide forest&quot;,&quot;ivy-hall&quot;:&quot;Ivy hall&quot;,&quot;carriage&quot;:&quot;Skeleton carriage&quot;,&quot;discovery-tree&quot;:&quot;Lilith’s discovery&quot;,&quot;hot-cave&quot;:&quot;Hot-stream cave&quot;,&quot;hot-stream&quot;:&quot;Hot river&quot;,&quot;plain&quot;:&quot;Grassy plain&quot;,&quot;bulika&quot;:&quot;Bulika&quot;,&quot;palace&quot;:&quot;Fortress-palace&quot;,&quot;square&quot;:&quot;Bat-pillar square&quot;,&quot;bulika-camp&quot;:&quot;Exterior camp&quot;,&quot;restored-upper&quot;:&quot;Later upstream country&quot;,&quot;mountain-city&quot;:&quot;Mountain city&quot;,&quot;book-door&quot;:&quot;Cloud stair / book-door&quot;,&quot;library&quot;:&quot;Library &amp; closet&quot;,&quot;garret&quot;:&quot;Garret mirror&quot;,&quot;church&quot;:&quot;Ruined church&quot;,&quot;lost-tower&quot;:&quot;Lost tower&quot;,&quot;sexton&quot;:&quot;Sexton’s cottage&quot;,&quot;palace-passages&quot;: <script>(() => {
  const frame = document.getElementById("codex-visualization");
  if (!(frame instanceof HTMLIFrameElement)) {
    return;
  }
  let viewportHeight = globalThis.innerHeight;
  const storageKey = `codex:visualization-widget-state-v2:${JSON.stringify([
    globalThis.location.pathname,
    globalThis.location.search,
  ])}`;
  const parseState = (serializedState) => {
    if (
      typeof serializedState !== "string" ||
      new TextEncoder().encode(serializedState).length > 16 * 1024
    ) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );

      state == null ||
      typeof state !== "object" ||
      Array.isArray(state) ||
      ("imageIds" in state &&
        (!Array.isArray(state.imageIds) || state.imageIds.length > 0))
    ) {
      throw new TypeError("Widget state must be a JSON object");

    const storedState = { modelContent: null, privateContent: null, ...state };

      storedState,
      (_key, /** @type {unknown} */ value) => {
        if (typeof value === "number" && !Number.isFinite(value)) {
          throw new TypeError("Widget state must contain finite numbers");

    );

    widgetState: state,

    const data = event.data;

        Number.isFinite(height) &&

        return;

        anchor.rel = "noopener noreferrer";
